  { n: `Globex`, ind: `Technology`, hq: `Remote / San Francisco, CA`, size: `1,000–5,000 employees`, jobs: [[`Software Engineering Intern`, `Closes Nov 20`]], hires: [[`Ana R.`, `Software Engineer · Career Prep 2023`]] },
  { n: `Initech`, ind: `Consulting`, hq: `Chicago, IL`, size: `5,000–10,000 employees`, jobs: [[`Associate Consultant`, `Closes Dec 1`]], hires: [] }
];
const BSCHOOLS = [
  [`Ross School of Business`, `University of Michigan`, `Ann Arbor, MI`, `Full-time · Weekend · Online`],
  [`Kellogg School of Management`, `Northwestern University`, `Evanston, IL`, `Full-time · Evening & Weekend`],
  [`The Wharton School`, `University of Pennsylvania`, `Philadelphia, PA`, `Full-time · Executive`],
  [`Fuqua School of Business`, `Duke University`, `Durham, NC`, `Full-time · Executive`],
  [`Stanford Graduate School of Business`, `Stanford University`, `Stanford, CA`, `Full-time`]
];
const UGSCHOOLS = [
  [`Wayne State University`, `Detroit, MI`, `Public, 4-year or above`, 41],
  [`University of Michigan-Ann Arbor`, `Ann Arbor, MI`, `Public, 4-year or above`, 63],
  [`Michigan State University`, `East Lansing, MI`, `Public, 4-year or above`, 38],
  [`Howard University`, `Washington, DC`, `Private not-for-profit, 4-year or above`, 52],
  [`Spelman College`, `Atlanta, GA`, `Private not-for-profit, 4-year or above`, 47],
  [`Georgia Institute of Technology-Main Campus`, `Atlanta, GA`, `Public, 4-year or above`, 29]
];

const pick = (list, key, i, label) => `<div class="item" data-${key}="${i}" style="cursor:pointer;${S[key === 'co' ? 'coSel' : 'bsSel'] === i ? 'background:var(--fill);border-radius:6px;padding-left:6px' : ''}">${label}</div>`;

const COMPANY_PROFILE = (c, edit) => `<div class="stack">${ADMIN_FLAG(c)}
  ${W('Company header', `<div class="row"><div class="img" style="width:64px;height:64px">logo</div><div class="sp"><b style="font-family:var(--display);font-size:20px">${c.n}</b><div style="font-size:12px;color:var(--ink2)">${c.ind} · ${c.hq} · ${c.size}</div></div>${B('Visit careers page ↗', { sm: 1, p: !edit })}${edit ? B('Edit', { sm: 1 }) : ''}</div>${edit ? `<div style="margin-top:10px">${F('Careers page URL', 'https://careers.acme.example')}</div>` : ''}`, { c: 'key' })}
  ${W('About', edit ? I('A short description of the company, culture, and what fellows should know…', 'area') : L('', 'm', 's'))}
  <div class="g2">
    ${W('Open roles on MLT · added automatically', (c.jobs.map(j => ITEM(j[0], j[1], B('View', { sm: 1, go: 'jobs' }))).join('') || '<div style="font-size:12px;color:var(--ink2)">No open roles right now.</div>') + `<div style="font-size:10.5px;color:var(--ink2);margin-top:6px">Any posting this company adds to the portal shows up here on its own.</div>`)}
    ${W(`MLT fellows hired here · up to 3${edit ? ` · ${c.hires.length} of 3 chosen` : ''}`, (c.hires.map(h => ITEM(h[0], h[1], edit ? B('Remove', { sm: 1 }) : '', { av: h[0].split(' ').map(x => x[0]).join('') })).join('') || '<div style="font-size:12px;color:var(--ink2)">None featured yet.</div>') + (edit ? `<div class="row" style="margin-top:8px">${B('Choose from MLT hires ▾', { sm: 1 })}<span style="font-size:10.5px;color:var(--ink2)">Only the main rep can choose</span></div>` : ''), { hl: 'hires' })}
  </div>
  ${REPS_PANEL(c)}
</div>`;

P.companies = r => {
  if (r === 'company' && S.crep !== 'mba') {
    const main = S.crep === 'main';
    return HDR('My Company', main ? 'You are the company admin (main rep), so you manage this page.' : 'Only the company admin (Kim L.) can edit this page.', C(main ? 'Main rep · can edit' : 'Rep · view only', main ? 'd' : 'g')) + COMPANY_PROFILE(COMPANIES[0], main);
  }
  const c = COMPANIES[S.coSel] || COMPANIES[0];
  return HDR('Companies', 'MLT partner companies, their open roles, and fellows they have hired', '') + `<div class="split">
    ${W('Company directory', SEARCH('Search companies') + COMPANIES.map((x, i) => pick(COMPANIES, 'co', i, `<div class="img" style="width:34px;height:34px;flex:none">logo</div><div class="t"><b>${x.n}</b><span>${x.ind} · ${x.jobs.length} open roles</span></div>`)).join('') + `<div style="font-size:10.5px;color:var(--ink2);margin-top:10px;font-family:var(--mono)">1–3 of 44</div>`)}
    ${COMPANY_PROFILE(c, (r === 'pm' || r === 'admin'))}
  </div>`;
};

P.bschools = r => {
  const officer = r === 'company' && S.crep === 'mba';
  const s = officer ? BSCHOOLS[0] : BSCHOOLS[S.bsSel] || BSCHOOLS[0];
  const profile = `<div class="stack">
    ${W('School header', `<div class="row"><div class="img" style="width:64px;height:64px">logo</div><div class="sp"><b style="font-family:var(--display);font-size:20px">${s[0]}</b><div style="font-size:12px;color:var(--ink2)">${s[1]} · ${s[2]}</div><div class="row" style="margin-top:6px">${s[3].split(' · ').map(f => C(f)).join('')}</div></div>${B('Admissions site ↗', { sm: 1, p: !officer })}</div>`, { c: 'key' })}
    <div class="g2">
      ${W('Application rounds', ['Round 1', 'Round 2', 'Round 3'].map(x => ITEM(x, officer ? 'Deadline: [date] · decision: [date]' : 'Deadline: [date]', officer ? B('Edit', { sm: 1 }) : '')).join(''))}
      ${W('About the program', officer ? I('What MLT fellows should know about your program…', 'area') : L('', 'm', 's'))}
    </div>
    ${W('MLT connection', ITEM('MLT fellows admitted', 'Last 3 cycles', C('[count]')) + ITEM('Admissions contact', 'Lena W. · MBA Admissions Officer', officer ? '' : B('Message', { sm: 1, go: 'messages' })))}
  </div>`;
  if (officer) return HDR('My Business School', 'You manage this profile as the MBA Admissions Officer for Ross. The list of schools itself is fixed.', B('Save', { p: 1, sm: 1 })) + profile;
  return HDR('Business Schools', 'A fixed list of MBA programs. Each school\'s MBA Admissions Officer keeps its profile up to date.', C('Static list', 'g')) + `<div class="split">
    ${W('MBA programs', SEARCH('Search schools') + BSCHOOLS.map((b, i) => pick(BSCHOOLS, 'bs', i, `<div class="t"><b>${b[0]}</b><span>${b[1]} · ${b[2]}</span></div>`)).join(''))}
    ${profile}
  </div>`;
};

P.ugschools = r => {
  const ugFellow = r === 'fellow';
  const peers = ugFellow ? W('Fellows at your school · Wayne State University', `<div style="font-size:11px;color:var(--ink2);margin-bottom:8px">Visible only to Ascend and Career Prep fellows at the same school.</div>` + [['Noah B.', 'Career Prep · Class of 2028', 'NB'], ['Mia J.', 'Ascend · Class of 2029', 'MJ'], ['Andre K.', 'Career Prep · Class of 2027', 'AK']].map(p => ITEM(p[0], p[1], B('Message', { sm: 1, go: 'messages' }), { av: p[2] })).join('') + `<div style="font-size:10.5px;color:var(--ink2);margin-top:8px;font-family:var(--mono)">41 fellows at this school · ‹ 1 2 ›</div>`, { c: 'key', hl: 'peers' }) : '';
  return HDR(ugFellow ? 'My School' : 'Undergrad Schools', 'Every school name matches the NCES IPEDS listing exactly. Names come from IPEDS and cannot be typed in by hand.', r === 'admin' ? B('Sync from IPEDS', { sm: 1 }) : C('Source: NCES IPEDS', 'g')) + `<div class="stack">
    ${peers}
    ${W('Search IPEDS institutions', `<div class="row" style="margin-bottom:12px">${I('⌕ Search by name, city, or state…').replace('class="inp ', 'class="inp sp ')}${I('State ▾')}${I('Sector ▾')}</div>` + T(['Institution name (as listed in IPEDS)', 'IPEDS UnitID', 'City, state', 'Sector', r === 'prospect' ? '' : 'MLT fellows'], UGSCHOOLS.map(u => [`<b>${u[0]}</b>`, `<span style="font-family:var(--mono)">[UnitID]</span>`, u[1], u[2], r === 'prospect' ? B('Select', { sm: 1 }) : String(u[3])])) + `<div style="font-size:10.5px;color:var(--ink2);margin-top:8px">Sample rows. The real list and UnitIDs load from IPEDS${r === 'admin' ? ' · last sync [date]' : ''}.</div>`)}
  </div>`;
};

// Menus.
NAV_GROUPS.fellow = [['Home', ['dashboard', 'status', 'assistant']], ['People', ['coachinfo', 'messages', 'ugschools']], ['Program', ['schedule', 'modules']], ['Opportunities', ['jobs', 'events', 'companies']], ['Account', ['settings']]];
NAV_GROUPS.coach = [['Home', ['dashboard', 'inbox', 'assistant']], ['People', ['fellows', 'nudge', 'messages', 'coachinfo', 'ugschools']], ['Program', ['admissions', 'coachstats', 'schedule', 'modules']], ['Opportunities', ['jobs', 'events', 'companies', 'bschools']], ['Account', ['settings']]];
NAV_GROUPS.admin = [['Home', ['dashboard', 'inbox', 'assistant']], ['People', ['users', 'fellows', 'coachinfo', 'accounts']], ['Program', ['program', 'admissions', 'approvals', 'exits', 'modules']], ['Opportunities', ['jobs', 'events', 'companies', 'bschools']], ['Directories', ['ugschools']], ['Account', ['settings']]];
const COMPANY_NAV = {
  main: [['Home', ['dashboard', 'assistant']], ['People', ['messages']], ['Opportunities', ['companies', 'accounts', 'jobs', 'events']], ['Account', ['aboutme', 'settings']]],
  mba: [['Home', ['dashboard', 'assistant']], ['People', ['messages']], ['My School', ['bschools', 'events']], ['Account', ['aboutme', 'settings']]]
};
COMPANY_NAV.rep = COMPANY_NAV.main;
Object.defineProperty(NAV_GROUPS, 'company', { get: () => COMPANY_NAV[S.crep] });
['fellow', 'coach', 'admin'].forEach(k => { NAV[k] = NAV_GROUPS[k].flatMap(g => g[1]); });
Object.defineProperty(NAV, 'company', { get: () => COMPANY_NAV[S.crep].flatMap(g => g[1]) });
Object.defineProperty(MOBILE_TABS, 'company', { get: () => S.crep === 'mba' ? ['dashboard', 'bschools', 'messages', 'assistant'] : ['dashboard', 'companies', 'jobs', 'assistant'] });
WS_NAV.partners[1][1].push('companies', 'bschools');
WS_NAV.admissions[1][1].push('ugschools');

Object.assign(PAGES, {
  companies: { title: 'Companies', url: '/companies', alt: { company: 'My Company' } },
  bschools: { title: 'Business Schools', url: '/business-schools', alt: {} },
  ugschools: { title: 'Undergrad Schools', url: '/schools', alt: { fellow: 'My School' } }
});
Object.defineProperty(PAGES.bschools.alt, 'company', { get: () => S.crep === 'mba' ? 'My Business School' : undefined, enumerable: true });
Object.assign(PERMS, {
  companies: { admin: ['E', 'any company'], pm: ['E', 'Partners workstream'], coach: ['V'], fellow: ['V'], company: ['E', 'main rep: own page'], prospect: ['V'] },
  bschools: { admin: ['E', 'manage the list'], pm: ['E', 'Partners workstream'], coach: ['V'], fellow: ['V'], company: ['E', 'MBA officer: own school'], prospect: ['V'] },
  ugschools: { admin: ['E', 'IPEDS sync only'], pm: ['V', 'Admissions workstream'], coach: ['V'], fellow: ['V', 'peers: Ascend + Career Prep'], company: ['N'], prospect: ['V', 'pick school in application'] }
});
DATA_PERMS.push(
  { name: 'Featured MLT hires (up to 3)', sub: 'on the company page', p: 'companies', v: { admin: ['E'], pm: ['E'], coach: ['V'], fellow: ['V'], company: ['E', 'main rep only'], prospect: ['V'] } },
  { name: 'See fellows at my school', sub: 'Ascend + Career Prep only', p: 'ugschools', v: { admin: ['V'], pm: ['V'], coach: ['V', 'own fellows'], fellow: ['V', 'same school, Ascend + Career Prep'], company: ['N'], prospect: ['N'] } }
);
Object.assign(ANNO, {
  companies: { what: 'One page per partner company: basic info, a link to its careers page, every portal posting from that company (added automatically), and up to 3 featured MLT fellows the company has hired.', roles: { company: 'The main rep edits the page and picks the 3 featured hires. Other reps at the same company can only view it. Use the Rep type switch at the top.', fellow: 'Browse companies and their open roles. Click a rep name to see their About me.', pm: 'Partner Management workstream. Can edit any company page.', admin: 'Can edit any company page.' } },
  bschools: { what: 'A fixed list of MBA programs. MLT controls which schools are on it; each school has an MBA Admissions Officer who keeps its profile (rounds, deadlines, about) up to date.', roles: { company: 'MBA Admissions Officer (a company rep subtype) edits only their own school. Use the Rep type switch at the top.', pm: 'Partner Management workstream.', all: 'Everyone else browses read-only.' } },
  ugschools: { what: 'A searchable list of every undergraduate institution, named exactly as NCES IPEDS lists it (with its IPEDS UnitID). Names come from IPEDS, so nobody types a school name in by hand.', roles: { fellow: 'My School: Ascend and Career Prep fellows also see other fellows at the same school. Fellows in other programs only see the search.', prospect: 'Used when picking a school in the application.', admin: 'Runs the IPEDS sync. Cannot add or rename schools by hand.', pm: 'Admissions workstream: school data for applicants.' } }
});

// MBA Admissions Officer dashboard.
const _dash4 = P.dashboard;
P.dashboard = r => r !== 'company' || S.crep !== 'mba' ? _dash4(r) : HDR('Good afternoon, Lena', 'Ross School of Business · MBA Admissions Officer', '') + `<div class="stack">
  ${DUESTRIP([['Update Round 2 deadline on your school profile', 'My Business School', 'NOV 15', 1], ['MBA Prep info session', 'Events · you are a panelist', 'NOV 19']])}
  <div class="g3">${KPI('[count]', 'MBA Prep fellows interested in Ross')}${KPI('80%', 'Profile complete')}${KPI('2', 'Unread messages')}</div>
  ${W('Shortcuts', `<div class="row">${B('Edit school profile', { sm: 1, p: 1, go: 'bschools' })}${B('Events', { sm: 1, go: 'events' })}${B('Messages', { sm: 1, go: 'messages' })}</div>`)}
</div>`;

// Company admin (main rep) handover: if the admin leaves, the seat stays empty until the account-owner PM picks a new one.
COMPANIES[0].reps = [[`Kim L.`, `admin`], [`Ravi S.`, `rep`]];
COMPANIES[1].reps = [[`Jo K.`, `rep`], [`Alex G.`, `pending`]];
COMPANIES[1].left = { who: `Sam W.`, when: `Oct 28`, owner: `Priya R.` };
COMPANIES[2].reps = [[`Dev R.`, `admin`]];
const staffView = () => S.role === 'pm' || S.role === 'admin';
const ADMIN_FLAG = c => !c.left ? '' : staffView()
  ? W('Company admin unassigned', `<div class="row"><span class="due hot">!</span><div class="sp"><b style="font-size:12.5px">${c.left.who} (company admin) left ${c.n} on ${c.left.when}</b><div style="font-size:11px;color:var(--ink2)">Flagged to the account owner, ${c.left.owner}. Until a new admin is chosen, only MLT staff can edit this page and pick featured hires.</div></div>${B('Designate new company admin', { sm: 1, p: 1, modal: 'designateAdmin', hl: 'designate' })}</div>`, { c: 'key fill' })
  : W('Company admin', `<div style="font-size:12px">This company doesn't have a company admin right now. MLT is assigning one.</div>`, { c: 'dash' });
const REPS_PANEL = c => W('Company reps', (c.left ? ITEM('Company admin', `Unassigned · ${c.left.who} left ${c.left.when}`, C('Unassigned', 'd')) : '') +
  c.reps.map(([n, t]) => ITEM(REP(n), t === 'admin' ? 'Company admin (main rep) · manages this page' : t === 'pending' ? 'Rep · access request pending' : 'Rep', staffView() && c.left && t === 'rep' ? B('Make company admin', { sm: 1, modal: 'designateAdmin' }) : '', { av: n.split(' ').map(x => x[0]).join('') })).join(''));

M.designateAdmin = () => MH('Designate company admin · Globex') + `<div class="stack" style="gap:12px"><div style="font-size:12px">The previous company admin, Sam W., left on Oct 28. Choose who manages Globex's company page, featured hires, and reps.</div>
  <div class="fld">New company admin${RADIO(['Jo K. · Rep at Globex', 'Alex G. · access request pending (approve first)', 'Invite someone new from Globex'], 0)}</div>
  ${F('Note to the new admin (optional)', 'Welcome note…', 'area')}
  <div class="row" style="font-size:11px;color:var(--ink2)">They get an email and an in-portal notice. Other Globex reps are told who the new admin is.</div>
  <div class="row"><span class="sp"></span>${B('Leave unassigned', { sm: 1, close: 1 })}${B('Make company admin', { p: 1, close: 1, hl: 'confirm-designate' })}</div></div>`;

PM_INBOX.push(['Partner', 'Globex has no company admin', 'Sam W. left Oct 28 · you are the account owner', 'TODAY', 1, 'Designate', { modal: 'designateAdmin' }, 'partners']);
INBOX.admin.push(['Partner', 'Globex has no company admin', 'Flagged to account owner Priya R.', 'NOV 4', 0, 'Open', { go: 'companies' }]);
DATA_PERMS.push({ name: 'Designate company admin', sub: 'when the main rep leaves', p: 'companies', v: { admin: ['E'], pm: ['E', 'account owner'], coach: ['N'], fellow: ['N'], company: ['N'], prospect: ['N'] } });
ANNO.companies.roles.pm = 'Partner Management workstream. Can edit any company page. If a company admin (main rep) leaves, the account-owner PM is flagged in the Inbox and on the company page, and designates the new admin. The seat stays unassigned until then.';

</script>
<script>
/* ===== app.js ===== */
// App shell: state, prototype frame, sitemap, permissions matrix, flows.
const S = { view: 'proto', role: 'fellow', page: 'dashboard', mobile: false, modal: null, flow: null, step: 0, tier: 3, cohort: 'all', aud: 'fellows', aq: 0, ciSel: 0, ev: 0, svType: 'pre', svAud: 'fellow', pstage: 'pre', admTab: 'pipeline', prog: 1, ibx: 'all', ws: 'admissions', dctab: 'accept', cyc: '1', plv: 'ug', crep: 'main', coSel: 0, bsSel: 0 };
const RA = { admin: 'A', pm: 'PM', coach: 'C', fellow: 'F', company: 'CR', prospect: 'P' };
const $ = s => document.querySelector(s);
const seg = (attr, items, cur) => `<div class="seg">${items.map(([k, l]) => `<button data-${attr}="${k}" class="${k === cur ? 'on' : ''}">${l}</button>`).join('')}</div>`;

function renderTop() {
  $('#top').innerHTML = `<div class="brand"><b>MLT Fellow Portal</b><span>Low-fidelity wireframe · v0.1 · Nov 2, 2026</span></div>
    <div class="ctl"><label>View</label>${seg('view', [['proto', 'Prototype'], ['map', 'Sitemap'], ['perms', 'Permissions'], ['flows', 'Key flows']], S.view)}</div>
    <div class="ctl"><label>Role</label>${seg('role', ROLE_KEYS.map(k => [k, ROLES[k].label]), S.role)}</div>
    ${S.role === 'pm' && S.view === 'proto' ? `<div class="ctl"><label>Workstream</label>${seg('ws', Object.entries(WS_SHORT), S.ws)}</div>` : ''}
    ${S.role === 'prospect' && S.view === 'proto' ? `<div class="ctl"><label>Stage</label>${seg('pstage', Object.entries(PSTAGES), S.pstage)}</div>` : ''}
    ${S.role === 'company' && S.view === 'proto' ? `<div class="ctl"><label>Rep type</label>${seg('crep', Object.entries(CREP), S.crep)}</div>` : ''}
    ${S.role === 'company' && S.crep !== 'mba' && S.view === 'proto' ? `<div class="ctl"><label>Access level</label>${seg('tier', [1, 2, 3].map(n => [String(n), 'L' + n + (n === 3 ? ' Premier' : '')]), String(S.tier))}</div>` : ''}
    ${S.view === 'proto' ? `<div class="ctl"><label>Device</label>${seg('dev', [['d', 'Desktop'], ['m', 'Mobile']], S.mobile ? 'm' : 'd')}</div>` : ''}`;
}

function flowBar() {
  if (!S.flow) return '';
  const f = FLOWS.find(x => x.id === S.flow), st = f.steps[S.step];
  return `<div class="flowbar"><div class="fb-t"><small>Flow · ${f.title} · Step ${S.step + 1} of ${f.steps.length} · as ${ROLES[st.r].label}</small>${st.t}</div>
    <div class="dots">${f.steps.map((_, i) => `<i class="${i === S.step ? 'on' : ''}"></i>`).join('')}</div>
    <button class="ghost" data-fprev ${S.step ? '' : 'disabled'}>‹ Back</button>
    ${S.step < f.steps.length - 1 ? '<button data-fnext>Next ›</button>' : '<button data-fexit>Finish ✓</button>'}
    <button class="ghost" data-fexit>Exit</button></div>`;
}

// Grouped menu with section labels; the Inbox shows a count badge.
function NAV_MENU(r, p) {
  return NAV_GROUPS[r].map(([label, keys]) => `<div class="navgrp">${label}</div>` + keys.map(k => `<button class="nav ${k === p ? 'on' : ''}" data-nav="${k}" style="width:100%">${pageTitle(k, r)}${k === 'inbox' && inboxCount(r) ? `<span class="badge">${inboxCount(r)}</span>` : ''}</button>`).join('')).join('');
}

function renderProto() {
  const r = S.role, p = S.page, loggedOut = p === 'login';
  const nav = NAV[r];
  const ok = loggedOut || canSee(p, r);
  const body = ok ? P[p](r) : `<div class="noaccess"><h3 style="font-family:var(--display)">No access</h3>${ROLES[r].label}s can't see ${PAGES[p].title}. It isn't in their navigation.</div>`;
  const mt = MOBILE_TABS[r] || nav.slice(0, 4);
  const tabs = mt.map(k => `<button data-nav="${k}" class="${k === p ? 'on' : ''}">${k === 'assistant' ? 'Ask' : pageTitle(k, r).split(/[ &]/)[0]}</button>`).join('') + `<button data-modal="more" class="${mt.includes(p) ? '' : 'on'}">More</button>`;
  const frame = `<div class="frame ${S.mobile ? 'm' : ''}" id="frame">
    <div class="url"><i></i><i></i><i></i><span>portal.mlt.org${PAGES[p].url}</span></div>
    ${loggedOut ? '' : `<div class="mtop"><span class="ham" data-modal="more"></span><b>MLT Portal</b><span class="av">${ROLES[r].init}</span></div>`}
    <div class="app">
      ${loggedOut ? '' : `<nav class="side"><div class="logo">LOGO</div>${NAV_MENU(r, p)}
        <div class="me"><span class="av">${ROLES[r].init}</span><div class="sp"><b>${ROLES[r].who}</b><div style="color:var(--ink2);font-size:10px">${ROLES[r].label}</div></div><button class="btn sm" data-nav="login">Log out</button></div>${r === 'pm' ? '<button class="btn sm" data-modal="roleSwitch" style="margin-top:8px;width:100%">Switch role ▾</button>' : ''}</nav>`}
      <div class="content" id="content">${body}</div>
    </div>
    ${loggedOut ? '' : `<div class="tabbar">${tabs}</div>`}
    ${S.modal ? `<div class="scrim" data-scrim><div class="modal">${S.modal === 'more' ? moreMenu() : M[S.modal]()}</div></div>` : ''}
  </div>`;
  $('#main').innerHTML = `<div class="proto"><div class="stage">${flowBar()}${frame}</div>${annotation()}</div>`;
  highlight();
}

function moreMenu() {
  return MH('Menu') + NAV_MENU(S.role, S.page) + `<button class="nav" style="width:100%" data-nav="login">Log out</button>`;
}

function annotation() {
  const p = S.page, a = ANNO[p], r = S.role;
  const roles = Object.entries(a.roles).map(([k, v]) => `<li class="${k === r || (k === 'all' && !a.roles[r]) ? 'me-r' : ''}"><b>${k === 'all' ? 'Everyone' : ROLES[k].label}:</b> ${v}</li>`).join('');
  const who = ROLE_KEYS.filter(k => p === 'login' || canSee(p, k)).map(k => C(RA[k] + ' · ' + PERMS[p][k][0], PERMS[p][k][0] === 'E' ? 'd' : '')).join(' ');
  const flows = FLOWS.filter(f => f.steps.some(s => s.p === p));
  return `<aside class="anno">
    <div class="sticky"><h4>${pageTitle(p, r)}</h4><p>${a.what}</p><ul>${roles}</ul></div>
    <div class="wf" data-l="Who can access"><div class="row" style="gap:6px">${who}</div><div style="font-size:11px;color:var(--ink2);margin-top:8px">E = view + edit · V = view only</div></div>
    ${flows.length ? `<div class="wf" data-l="Flows on this page">${flows.map(f => `<div class="item"><div class="t"><b>${f.title}</b></div><button class="btn sm" data-fstart="${f.id}">Play ▸</button></div>`).join('')}</div>` : ''}
    <div class="legend">Click nav items, buttons, slots, and cards to move between screens. Switch roles at the top: each role gets its own navigation. Bold labels mark interactive elements.</div>
  </aside>`;
}

function highlight() {
  if (!S.flow) return;
  const st = FLOWS.find(x => x.id === S.flow).steps[S.step];
  const el = st.hl && document.querySelector(`#frame [data-hl="${st.hl}"]`);
  if (!el) return;
  el.classList.add('pulse');
  el.setAttribute('data-step', 'Step ' + (S.step + 1));
  if (el.tagName !== 'TR') el.style.position = el.style.position || 'relative';
  setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
}

// ---------- sitemap ----------
const SUBS = {
  users: ['Invite user (modal)', 'Edit user / change role'],
  approvals: ['Job posting review', 'Coach reassignment', 'Sign-up approval'],
  program: ['Program setup form', 'Coach compliance', 'Fellow compliance', 'Milestones'],
  fellows: ['Fellow profile', 'Call notes', 'AI summary upload', 'Assign task (modal)'],
  schedule: ['Book call (modal)', 'Leave feedback (modal)', 'Coach availability'],
  modules: ['Lesson player', 'Assignment submit', 'Quiz'],
  jobs: ['Job detail & apply (modal)', 'Saved / My applications'],
  accounts: ['Account detail + relationship log', 'Post a job (modal)', 'Applicants'],
  messages: ['Conversation'],
  assistant: ['Chat + suggested prompts', 'Answer actions (draft, nudge, open)', 'Data scope panel'],
  coachinfo: ['Coach directory (fellow, PM)', 'Edit own profile (coach)'],
  events: ['Cvent registration links', 'Pre + post surveys (fellow and rep versions)', 'Survey builder (PM, Admin)', 'Completion tracking + nudges'],
  inbox: ['Filter by type', 'Today vs. later', 'One action per item'],
  programs: ['Program cards', 'Fee comparison'],
  decisioncomms: ['Accept / Waitlist / Decline templates', 'Preview + scheduled release'],
  cycles: ['Cycles by program', 'Next cycle setup', 'Coach availability'],
  reports: ['YoY KPIs', 'Charts + table', 'Build a view', 'Board pack export'],
  matching: ['Partner request', 'Suggested fellows', 'Share shortlist'],
  companies: ['Company directory', 'Company page (main rep edits)', 'Featured MLT hires'],
  bschools: ['MBA program list', 'School profile (MBA officer edits)'],
  ugschools: ['IPEDS search', 'Fellows at my school'],
  apply: ['Basics (at sign-up)', 'Uploads: resume + transcript', 'Elevator pitch video', 'Essays', 'Submit'],
  onboard: ['Contract + code of conduct', 'Program fee (full or installments)', 'Onboarding survey'],
  admissions: ['AI initial score', 'Human scoring rubric', 'Decision (modal)', 'Application settings'],
  aboutme: ['Edit + preview (rep)', 'Read-only view (fellow)'],
  nudge: ['Audience tabs (PM)', 'Bulk nudge + template'],
  exits: ['Process withdrawal (modal)', 'Issue infraction (modal)', 'Dismiss fellow (modal)', 'Dismissal rules'],
  status: ['Infraction history', 'Upcoming timeline'],
  coachstats: ['Feedback time series', 'Per-question averages'],
  settings: ['Profile', 'Notifications', 'Integrations (Admin)']
};
const rd = p => `<div class="rd">${ROLE_KEYS.filter(k => p === 'login' || canSee(p, k)).map(k => `<i style="${PERMS[p][k][0] === 'E' ? 'background:var(--ink);color:var(--sheet)' : ''}">${RA[k]}</i>`).join('')}</div>`;
const firstRole = p => canSee(p, S.role) ? S.role : ROLE_KEYS.find(k => canSee(p, k));

function renderMap() {
  const pages = Object.keys(PAGES).filter(p => p !== 'login' && p !== 'dashboard');
  $('#main').innerHTML = `<div class="sheet"><h2>Sitemap & page flow</h2><p class="sub">Every role logs in to a role-specific dashboard, then reaches only the pages in its navigation. Dashed boxes are sub-screens and modals. Role tags: filled = edit, outlined = view. Click any page to open it in the prototype.</p>
    <div class="smap" id="smap"><svg id="smsvg"></svg>
      <div class="tier"><button class="node root" id="n-login" data-jump="${S.role}|login"><b>Login / Sign up</b><span style="font-size:10px">invite · SSO · request access</span></button></div>
      <div class="tier"><button class="node root" id="n-dashboard" data-jump="${S.role}|dashboard"><b>Dashboard</b><span style="font-size:10px">role-specific · "Due soon" first</span></button></div>
      <div class="tier pages subs">${pages.map(p => `<div class="subcol"><button class="node" id="n-${p}" data-jump="${firstRole(p)}|${p}"><b>${PAGES[p].title}</b>${rd(p)}</button>${(SUBS[p] || []).map((s, i) => `<div class="node sub" id="s-${p}-${i}">${s}</div>`).join('')}</div>`).join('')}</div>
    </div></div>`;
  requestAnimationFrame(drawLines);
}

function drawLines() {
  const box = $('#smap'), svg = $('#smsvg');
  if (!box || !svg) return;
  const b = box.getBoundingClientRect();
  const pt = (id, side) => { const r = document.getElementById(id).getBoundingClientRect(); return [r.left + r.width / 2 - b.left, (side === 't' ? r.top : r.bottom) - b.top]; };
  const path = (a, c, dash) => { const my = (a[1] + c[1]) / 2; return `<path d="M${a[0]},${a[1]} C${a[0]},${my} ${c[0]},${my} ${c[0]},${c[1]}" fill="none" stroke="${dash ? '#8a8a86' : '#1b1b1b'}" stroke-width="1.4" ${dash ? 'stroke-dasharray="4 3"' : ''}/>`; };
  let out = path(pt('n-login', 'b'), pt('n-dashboard', 't'));
  Object.keys(PAGES).filter(p => p !== 'login' && p !== 'dashboard').forEach(p => {
    out += path(pt('n-dashboard', 'b'), pt('n-' + p, 't'));
    let prev = 'n-' + p;
    (SUBS[p] || []).forEach((_, i) => { out += path(pt(prev, 'b'), pt(`s-${p}-${i}`, 't'), 1); prev = `s-${p}-${i}`; });
  });
  svg.innerHTML = out;
}

// ---------- permissions ----------
function renderPerms() {
  const cell = (p, k, src = PERMS[p]) => { const [v, n] = src[k]; return `<td><button class="cell" data-jump="${k}|${p}"><b class="${v}">${v === 'N' ? '—' : v}</b>${n ? `<small>${n}</small>` : ''}</button></td>`; };
  $('#main').innerHTML = `<div class="sheet"><h2>Permissions matrix</h2><p class="sub"><b>E</b> = view + edit · <b>V</b> = view only · <b>—</b> = no access (page hidden from navigation). Click any cell to see that page as that role.</p>
    <div class="tblw"><table class="mx"><tr><th>Page</th>${ROLE_KEYS.map(k => `<th>${ROLES[k].label}</th>`).join('')}</tr>
    ${Object.keys(PAGES).map(p => `<tr><td>${PAGES[p].title}<span>${PAGES[p].url}</span></td>${ROLE_KEYS.map(k => cell(p, k)).join('')}</tr>`).join('')}
    <tr><th colspan="${ROLE_KEYS.length + 1}" style="text-align:left;padding-top:28px">Data-level rules (cut across pages)</th></tr>
    ${DATA_PERMS.map(d => `<tr><td>${d.name}<span>${d.sub}</span></td>${ROLE_KEYS.map(k => cell(d.p, k, d.v)).join('')}</tr>`).join('')}</table></div>
    <div class="row" style="margin-top:22px;gap:14px;align-items:stretch">${[1, 2, 3].map(n => W('Company ' + TIERS[n].label, `<b style="font-size:13px">${TIERS[n].name}</b><div style="font-size:11.5px;color:var(--ink2);margin-top:4px">${TIERS[n].sub}</div>`, { s: 'flex:1;min-width:200px' })).join('')}</div></div>`;
}

// ---------- flows ----------
function renderFlows() {
  $('#main').innerHTML = `<div class="sheet"><h2>Key flows</h2><p class="sub">Each flow walks across roles. Press Play to step through it in the prototype; the active element is outlined on every step.</p>
    <div class="flows">${FLOWS.map((f, i) => `<div class="flowcard"><div class="row"><h3 class="sp">${i + 1}. ${f.title}</h3><button class="btn p sm" data-fstart="${f.id}">Play ▸</button></div>
      <div class="row">${f.roles.map(k => C(ROLES[k].label)).join('')}</div>
      <ol>${f.steps.map(s => `<li><span class="sp">${s.t}</span><em>${RA[s.r]} · ${PAGES[s.p].title}</em></li>`).join('')}</ol></div>`).join('')}</div></div>`;
}

// ---------- routing ----------
function render() {
  // A PM page outside the current workstream (e.g. from a flow) switches to the workstream that owns it.
  if (S.role === 'pm' && S.page !== 'login' && !NAV.pm.includes(S.page) && wsFor(S.page)) S.ws = wsFor(S.page);
  renderTop();
  ({ proto: renderProto, map: renderMap, perms: renderPerms, flows: renderFlows })[S.view]();
}
function applyStep() {
  const st = FLOWS.find(x => x.id === S.flow).steps[S.step];
  Object.assign(S, { view: 'proto', role: st.r, page: st.p, modal: st.m || null }, st.set || {});
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-role],[data-tier],[data-cohort],[data-aud],[data-aq],[data-ci],[data-ev],[data-svtype],[data-svaud],[data-pstage],[data-admtab],[data-prog],[data-ibx],[data-ws],[data-dctab],[data-cyc],[data-plv],[data-crep],[data-co],[data-bs],[data-dev],[data-nav],[data-go],[data-modal],[data-close],[data-scrim],[data-jump],[data-fstart],[data-fnext],[data-fprev],[data-fexit]');
  if (!t) return;
  const d = t.dataset;
  if (d.prog !== undefined) { if (['pre', 'denied'].includes(S.pstage) && +d.prog !== S.prog || S.pstage === 'pre') S.pstage = 'applying'; S.prog = +d.prog; }
  if (d.setaq !== undefined) S.aq = +d.setaq;
  if (d.scrim !== undefined && e.target !== t) return;
  if (d.view) { S.view = d.view; S.modal = null; }
  else if (d.tier) S.tier = +d.tier;
  else if (d.cohort) S.cohort = d.cohort;
  else if (d.aud) S.aud = d.aud;
  else if (d.aq) S.aq = +d.aq;
  else if (d.ci) S.ciSel = +d.ci;
  else if (d.ev) S.ev = +d.ev;
  else if (d.svtype) S.svType = d.svtype;
  else if (d.svaud) S.svAud = d.svaud;
  else if (d.pstage) S.pstage = d.pstage;
  else if (d.admtab) S.admTab = d.admtab;
  else if (d.ibx) S.ibx = d.ibx;
  else if (d.ws) { S.ws = d.ws; if (!NAV.pm.includes(S.page)) S.page = 'dashboard'; }
  else if (d.dctab) S.dctab = d.dctab;
  else if (d.cyc) S.cyc = d.cyc;
  else if (d.plv) S.plv = d.plv;
  else if (d.crep) { S.crep = d.crep; if (S.page !== 'login' && !NAV.company.includes(S.page)) S.page = 'dashboard'; }
  else if (d.co) S.coSel = +d.co;
  else if (d.bs) S.bsSel = +d.bs;
  else if (d.role) { S.role = d.role; S.modal = null; S.aq = 0; S.ciSel = 0; if (S.page !== 'login' && !canSee(S.page, S.role)) S.page = 'dashboard'; }
  else if (d.dev) S.mobile = d.dev === 'm';
  else if (d.nav || d.go) { S.page = d.nav || d.go; S.modal = null; }
  else if (d.modal) S.modal = d.modal;
  else if (d.close !== undefined || d.scrim !== undefined) S.modal = null;
  else if (d.jump) { const [r, p] = d.jump.split('|'); Object.assign(S, { role: r, page: p, view: 'proto', modal: null }); }
  else if (d.fstart) { S.flow = d.fstart; S.step = 0; return applyStep(); }
  else if (d.fnext !== undefined) { S.step++; return applyStep(); }
  else if (d.fprev !== undefined) { S.step--; return applyStep(); }
  else if (d.fexit !== undefined) { S.flow = null; S.modal = null; }
  render();
});
window.addEventListener('resize', () => S.view === 'map' && drawLines());
render();

</script>
