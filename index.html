<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLT Fellow Portal Wireframe</title>
<style>
:root{
  --paper:#efeee9; --sheet:#fbfbf9; --ink:#1b1b1b; --ink2:#4a4a48; --ink3:#8a8a86;
  --line:#2a2a2a; --soft:#d9d8d2; --fill:#e6e5df; --fill2:#d2d1ca; --note:#e4e2da;
  --mono:"SF Mono",Menlo,"Courier New",monospace;
  --display:"Futura","Avenir Next Condensed","Gill Sans",sans-serif;
  --body:"Avenir Next","Gill Sans","Helvetica Neue",sans-serif;
  --hand:"Marker Felt","Chalkboard SE","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);background-image:radial-gradient(#cfcec7 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:14px;padding-bottom:72px}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- top chrome ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(239,238,233,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--ink)}
.top-in{max-width:1480px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:8px}
.ctl>label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12px;font-weight:600;border-right:1px solid var(--soft)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--sheet)}

/* ---------- views ---------- */
main{max-width:1480px;margin:0 auto;padding:24px}
.proto{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.proto.mob{grid-template-columns:minmax(0,1fr) 300px}
.stage{min-width:0;display:flex;flex-direction:column;align-items:center}
.flowbar{width:100%;background:var(--ink);color:var(--sheet);border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:center;margin-bottom:16px}
.flowbar .fb-t{flex:1}
.flowbar small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;display:block}
.flowbar button{background:var(--sheet);color:var(--ink);border:0;border-radius:6px;padding:6px 12px;font-weight:700;font-size:12px}
.flowbar button.ghost{background:transparent;color:var(--sheet);border:1px solid #777}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:#666}.dots i.on{background:var(--sheet)}

.frame{width:100%;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;min-height:680px}
.frame .url{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1.5px solid var(--ink);background:var(--fill)}
.frame .url i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.frame .url span{flex:1;margin-left:8px;background:var(--sheet);border:1px solid var(--ink3);border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.app{display:flex;flex:1;min-height:0}
.side{width:220px;flex:none;border-right:1.5px solid var(--ink);padding:16px 12px;display:flex;flex-direction:column;gap:1px;background:#f4f3ef}
.side .logo{border:1.5px dashed var(--ink2);height:40px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--ink2);margin-bottom:12px}
.nav{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;gap:8px;align-items:center}
.nav::before{content:"";width:14px;height:14px;border:1.5px solid var(--ink2);border-radius:3px;flex:none}
.navgrp{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:12px 10px 2px}
.navgrp:first-of-type{margin-top:0}
.badge{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:0 6px}
&.nav.on::before{border-color:var(--sheet)}
.nav:hover:not(.on){background:var(--fill)}
.side .me{margin-top:auto;border-top:1px solid var(--soft);padding-top:12px;display:flex;gap:8px;align-items:center;font-size:12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--fill2);border:1.5px solid var(--ink2);flex:none;display:grid;place-items:center;font-size:10px;font-weight:700}
.content{flex:1;min-width:0;padding:22px 24px 28px;overflow:auto}
.ph-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph-h h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.02em;flex:1}
.ph-h p{margin:2px 0 0;color:var(--ink2);font-size:12px;width:100%}

/* mobile device */
.frame.m{width:390px;border-radius:36px;border-width:2.5px;min-height:780px;box-shadow:6px 6px 0 var(--ink)}
.frame.m .url{justify-content:center;border-bottom:1px solid var(--soft);background:var(--sheet);padding:12px}
.frame.m .url i{display:none}.frame.m .url span{flex:none;font-size:10px}
.frame.m .app{flex-direction:column}
.frame.m .side{display:none}
.frame.m .content{padding:16px 14px 20px}
.frame.m .ph-h h1{font-size:21px}
.mtop{display:none}
.frame.m .mtop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1.5px solid var(--ink)}
.mtop .ham{width:28px;height:22px;border:1.5px solid var(--ink);border-radius:4px;background:repeating-linear-gradient(var(--sheet) 0 4px,var(--ink) 4px 5.5px);background-clip:content-box;padding:4px}
.mtop b{flex:1;font-family:var(--display);font-size:14px}
.tabbar{display:none}
.frame.m .tabbar{display:flex;border-top:1.5px solid var(--ink);padding:8px 6px 18px;background:#f4f3ef}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:4px 0;border-radius:8px}
.tabbar button::before{content:"";width:18px;height:18px;border:1.5px solid var(--ink2);border-radius:5px}
.tabbar button.on{font-weight:700}.tabbar button.on::before{background:var(--ink);border-color:var(--ink)}
.frame.m .g2,.frame.m .g3,.frame.m .g4,.frame.m .split{grid-template-columns:minmax(0,1fr)!important}
.frame.m .hide-m{display:none}

/* ---------- wireframe primitives ---------- */
.wf{position:relative;border:1.5px solid var(--line);border-radius:8px;padding:16px 14px 14px;background:var(--sheet);min-width:0}
.wf::before{content:attr(data-l);position:absolute;top:-8px;left:10px;background:var(--sheet);padding:0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.wf.dash{border-style:dashed}
.wf.fill{background:var(--fill)}.wf.fill::before{background:var(--fill)}
.wf.key{border-width:2.5px}
.wf h3{margin:0 0 10px;font-size:14px;font-family:var(--display);letter-spacing:.03em}
.stack{display:flex;flex-direction:column;gap:18px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.ln{height:8px;background:var(--fill2);border-radius:4px;margin:7px 0}
.ln.s{width:55%}.ln.m{width:78%}.ln.xs{width:30%}
.img{border:1.5px solid var(--ink2);background:linear-gradient(to top right,transparent calc(50% - 1px),var(--ink3) 50%,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),var(--ink3) 50%,transparent calc(50% + 1px)),var(--fill);border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--ink2);text-transform:uppercase}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:6px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.btn.p{background:var(--ink);color:var(--sheet)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.inp{border:1.5px solid var(--ink2);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--ink3);background:var(--sheet);min-width:0}
.inp.area{height:72px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--ink2)}
.chip{display:inline-block;border:1px solid var(--ink2);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:600;white-space:nowrap;background:var(--sheet)}
.chip.d{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip.g{background:var(--fill2);border-color:var(--fill2)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);border-bottom:1.5px solid var(--ink);padding:6px 6px}
.tbl td{border-bottom:1px solid var(--soft);padding:8px 6px;vertical-align:middle}
.tblw{overflow-x:auto}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft);font-size:12px}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:12.5px}.item .t span{color:var(--ink2);font-size:11px}
.due{font-family:var(--mono);font-size:10px;font-weight:700;border:1.5px solid var(--ink);border-radius:4px;padding:2px 6px;white-space:nowrap}
.due.hot{background:var(--ink);color:var(--sheet)}
.kpi b{font-family:var(--display);font-size:28px;display:block}
.kpi span{font-size:11px;color:var(--ink2)}
.bar{height:10px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sheet)}
.bar i{display:block;height:100%;background:var(--ink2)}
.chk{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;flex:none}
.chk.x{background:var(--ink)}
.bub{max-width:75%;border:1.5px solid var(--ink2);border-radius:12px;padding:8px 10px;font-size:12px;margin:6px 0}
.bub.me{margin-left:auto;background:var(--fill)}
.slot{border:1.5px solid var(--ink2);border-radius:6px;padding:6px;font-size:11px;text-align:center;background:var(--sheet)}
.slot.off{border-style:dashed;color:var(--ink3);background:transparent}
.slot.pick{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.noaccess{border:2px dashed var(--ink2);border-radius:10px;padding:60px 20px;text-align:center;color:var(--ink2)}

/* badges: fellow- and partner-facing */
.mltb{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px 1px 2px;font-size:10.5px;font-weight:700;background:var(--sheet);white-space:nowrap}
.mltb-ic{width:18px;height:18px;display:inline-grid;place-items:center;background:var(--ink);color:var(--sheet);font-size:10px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.mltb-ic.lg{width:44px;height:44px;font-size:20px;flex:none}
.mltb-ic.off{background:var(--fill2);color:var(--ink2)}

/* program goal marker: a drawn target */
.goals{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--fill)}
.goal-row{display:flex;gap:10px;align-items:center;font-size:12.5px}
.goal-row.alt{padding-left:4px}
.goal{width:24px;height:24px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--ink) 0 3px,var(--fill) 3.5px 6px,var(--ink) 6.5px 8px,var(--fill) 8.5px 10px,var(--ink) 10.5px 12px)}
.goal-or{width:24px;flex:none;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase}
.goal-l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* highlight for flows */
.pulse{outline:3px solid var(--ink);outline-offset:4px;animation:pl 1.4s ease-in-out infinite;z-index:2}
.tbl tr.pulse td{background:var(--fill2);font-weight:700}
.tbl tr.pulse::after{display:none}
@keyframes pl{50%{outline-offset:8px;outline-color:#777}}
.pulse::after{content:"▲ " attr(data-step);position:absolute;bottom:-30px;right:0;background:var(--ink);color:var(--sheet);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;white-space:nowrap;z-index:5}

/* modal */
.scrim{position:absolute;inset:0;background:rgba(27,27,27,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.modal:has(.wide){width:min(860px,100%)}
.modal .mh{display:flex;align-items:center;margin-bottom:14px}
.modal .mh h2{margin:0;font-family:var(--display);font-size:19px;flex:1}
.frame{position:relative}

/* annotation */
.anno{position:sticky;top:108px;display:flex;flex-direction:column;gap:18px}
.sticky{background:var(--note);border:1.5px solid var(--ink2);padding:18px 18px 16px;transform:rotate(-1deg);box-shadow:3px 4px 0 rgba(0,0,0,.12);font-family:var(--hand);font-size:15px;line-height:1.35}
.sticky::before{content:"";display:block;width:70px;height:16px;background:rgba(160,158,150,.45);margin:-26px auto 10px;transform:rotate(2deg)}
.sticky h4{margin:0 0 6px;font-size:18px}
.sticky p{margin:0 0 10px}
.sticky ul{margin:0;padding-left:18px}
.sticky li{margin-bottom:5px}
.sticky .me-r{font-weight:bold;text-decoration:underline}
.legend{font-family:var(--mono);font-size:10px;color:var(--ink2);line-height:1.6;border-top:1px dashed var(--ink3);padding-top:12px}

/* sitemap */
.sheet{background:var(--sheet);border:2px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--ink);padding:28px}
.sheet h2{font-family:var(--display);margin:0 0 4px;font-size:24px}
.sheet .sub{color:var(--ink2);margin:0 0 22px;font-size:13px}
.smap{position:relative}
.smap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tier{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:46px;position:relative;z-index:1}
.tier.pages{gap:10px}
.node{border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;padding:9px 11px;min-width:120px;max-width:170px;text-align:left;font-size:12px}
.node b{display:block;font-size:12.5px;margin-bottom:5px}
.node.root{background:var(--ink);color:var(--sheet);text-align:center}
.node.sub{border-style:dashed;min-width:110px;font-size:11px}
.node:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.rd{display:flex;gap:3px;flex-wrap:wrap}
.rd i{font-style:normal;font-family:var(--mono);font-size:9px;border:1px solid var(--ink2);border-radius:3px;padding:0 4px}
.subcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.tier.subs{align-items:flex-start}

/* matrix */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.mx th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:10px;border-bottom:2px solid var(--ink);text-align:center}
.mx th:first-child{text-align:left}
.mx td{border-bottom:1px solid var(--soft);padding:8px;text-align:center;vertical-align:top}
.mx td:first-child{text-align:left;font-weight:700}
.mx td:first-child span{display:block;font-weight:400;font-size:11px;color:var(--ink2)}
.cell{border:0;background:transparent;width:100%;padding:6px;border-radius:6px}
.cell:hover{background:var(--fill)}
.cell b{display:inline-block;font-family:var(--mono);font-size:11px;border:1.5px solid var(--ink);border-radius:4px;padding:1px 6px;min-width:22px}
.cell b.E{background:var(--ink);color:var(--sheet)}
.cell b.N{border-style:dashed;border-color:var(--ink3);color:var(--ink3)}
.cell small{display:block;font-size:10px;color:var(--ink2);margin-top:3px}

/* flows */
.flows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.flowcard{border:1.5px solid var(--ink);border-radius:10px;padding:18px;background:var(--sheet)}
.flowcard h3{margin:0 0 4px;font-family:var(--display);font-size:18px}
.flowcard ol{padding-left:0;list-style:none;margin:14px 0;counter-reset:s}
.flowcard li{counter-increment:s;display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--soft)}
.flowcard li::before{content:counter(s);font-family:var(--mono);font-size:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.flowcard li em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink2);text-transform:uppercase;white-space:nowrap}

@media (max-width:1100px){.proto{grid-template-columns:minmax(0,1fr)}.anno{position:static}.flows{grid-template-columns:minmax(0,1fr)}}
@media print{
  .top{position:static}.top .ctl{display:none}
  .frame,.sheet{box-shadow:none}
  .pulse{animation:none}
  .anno{position:static}
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<script>/* data.js */
// Roles, pages, permissions, annotations, and flows for the MLT Fellow Portal wireframe.
const ROLES = {
  admin:   { label: 'Admin',           who: 'Dana K.',  init: 'DK', sub: 'Site administrator' },
  pm:      { label: 'Program Manager', who: 'Priya R.', init: 'PR', sub: 'Career Prep 2027 cohort' },
  coach:   { label: 'Coach',           who: 'Marcus T.', init: 'MT', sub: '150 assigned fellows' },
  fellow:  { label: 'Fellow',          who: 'Jordan A.', init: 'JA', sub: 'Career Prep · Junior' },
  company: { label: 'Company Rep',     who: 'Kim L.',   init: 'KL', sub: 'Acme Corp (Account)' },
  prospect: { label: 'Prospect',       who: 'Avery K.', init: 'AK', sub: 'Applicant · Career Prep, Class of 2028' },
};
const ROLE_KEYS = Object.keys(ROLES);

// Page titles can change by role (e.g. "Accounts" reads as "My Account & Postings" for a company rep).
const PAGES = {
  login:     { title: 'Login / Sign up', url: '/login' },
  inbox:     { title: 'Inbox', url: '/inbox' },
  programs:  { title: 'Programs', url: '/programs', alt: { prospect: 'Choose a Program' } },
  apply:     { title: 'My Application', url: '/apply' },
  onboard:   { title: 'Enrollment', url: '/enroll' },
  admissions:{ title: 'Admissions', url: '/admissions', alt: { coach: 'Application Reviews' } },
  dashboard: { title: 'Dashboard', url: '/dashboard' },
  users:     { title: 'User Management', url: '/admin/users' },
  approvals: { title: 'Requests & Approvals', url: '/approvals' },
  program:   { title: 'Program Setup & Compliance', url: '/program' },
  fellows:   { title: 'My Fellows', url: '/fellows', alt: { pm: 'Fellows & Coaches', admin: 'Fellows & Coaches' } },
  schedule:  { title: 'Schedule a Call', url: '/schedule', alt: { coach: 'My Availability', pm: 'Call Calendar' } },
  modules:   { title: 'Modules & Assignments', url: '/learn' },
  jobs:      { title: 'Application Portal', url: '/jobs' },
  accounts:  { title: 'Accounts', url: '/accounts', alt: { company: 'My Account & Postings' } },
  messages:  { title: 'Messages', url: '/messages' },
  assistant: { title: 'MLT Assistant', url: '/assistant' },
  events:    { title: 'Events', url: '/events' },
  coachinfo: { title: 'Coach Info', url: '/coaches', alt: { coach: 'My Coach Info', fellow: 'Coach Info' } },
  aboutme:   { title: 'About Me (Company Rep)', url: '/about-me', alt: { company: 'About Me' } },
  nudge:     { title: 'Nudges', url: '/nudges', alt: { coach: 'Nudge Fellows' } },
  exits:     { title: 'Fellow Exits', url: '/exits' },
  status:    { title: 'Program Status', url: '/my-status' },
  coachstats:{ title: 'Coaching Insights', url: '/coach/insights' },
  settings:  { title: 'Settings & Profile', url: '/settings', alt: { admin: 'Site Settings & Integrations' } }
};
const pageTitle = (p, r) => (PAGES[p].alt && PAGES[p].alt[r]) || PAGES[p].title;

// Menus are grouped into the same sections for every role: Home, People, Program, Opportunities, Account.
const NAV_GROUPS = {

    { r: 'fellow', p: 'settings', hl: 'withdraw', t: 'Jordan opens Settings and clicks "Withdraw from program".' },
    { r: 'fellow', p: 'settings', m: 'withdraw', hl: 'submit-withdraw', t: 'Picks a reason and leaves feedback. Only the MLT team sees it, not the coach.' },
    { r: 'pm', p: 'exits', hl: 'withdraw-row', t: 'The request lands in the Program Manager\'s Withdrawals queue.' },
    { r: 'pm', p: 'exits', m: 'processWithdraw', hl: 'confirm-withdraw', t: 'Priya confirms it (or offers a retention call first). Access ends and the coach is notified.' }
  ]},
  { id: 'ai', title: 'Fellow asks the assistant for help rescheduling', roles: ['fellow'], steps: [
    { r: 'fellow', p: 'assistant', set: { aq: 1 }, hl: 'ai-q', t: 'Jordan asks: "How do I ask to reschedule an interview with Acme?"' },
    { r: 'fellow', p: 'assistant', set: { aq: 1 }, hl: 'ai-draft', t: 'The assistant gives tips and drafts an email using the application details.' },
    { r: 'fellow', p: 'assistant', set: { aq: 1 }, hl: 'ai-send', t: 'Jordan sends the draft to the Acme recruiter through Messages.' }
  ]},
  { id: 'event', title: 'PM builds a pre-event survey, nudges, and a fellow completes it', roles: ['pm', 'fellow', 'coach'], steps: [
    { r: 'pm', p: 'events', set: { ev: 0, svType: 'pre', svAud: 'fellow' }, hl: 'publish-survey', t: 'Priya builds the fellow version of the pre-event survey for the Fall Recruiting Summit and publishes it.' },
    { r: 'pm', p: 'events', set: { ev: 0 }, m: 'eventNudge', hl: 'send-event-nudge', t: 'Nudges the 224 registered fellows who have not done the pre-survey yet.' },
    { r: 'fellow', p: 'events', set: { ev: 0 }, hl: 'take-survey', t: 'Jordan (already registered through Cvent) opens the event and starts the survey.' },
    { r: 'fellow', p: 'events', set: { ev: 0 }, m: 'survey', hl: 'submit-survey', t: 'Completes the fellow version and submits it.' },
    { r: 'coach', p: 'events', set: { ev: 0 }, hl: 'survey-tracking', t: 'Marcus sees completion for his own fellows and can nudge anyone who has not finished.' }
  ]},
  { id: 'admit', title: 'Prospect applies, gets scored, accepted, and enrolls', roles: ['prospect', 'coach', 'pm', 'fellow'], steps: [
    { r: 'prospect', p: 'programs', set: { pstage: 'pre', prog: 1 }, hl: 'prog-apply', t: 'After creating an account, Avery compares programs, deadlines, and fees, then picks Career Prep.' },
    { r: 'prospect', p: 'apply', set: { pstage: 'applying' }, hl: 'pitch', t: 'Avery fills in basic info, uploads a resume and transcript, and records an elevator pitch.' },
    { r: 'prospect', p: 'apply', set: { pstage: 'applying' }, hl: 'submit-app', t: 'Finishes the essays and submits the application.' },
    { r: 'coach', p: 'admissions', hl: 'submit-score', t: 'The assistant pre-scores it. Marcus (assigned reviewer) scores it on the rubric before seeing the AI score.' },
    { r: 'pm', p: 'admissions', set: { admTab: 'pipeline' }, hl: 'ai-score', t: 'Priya sees the AI suggestion (82) next to 2 human scores. The AI does not decide.' },
    { r: 'pm', p: 'admissions', set: { admTab: 'pipeline' }, m: 'decision', hl: 'confirm-accept', t: 'Priya accepts Avery and picks the track, coach, and fee option.' },
    { r: 'prospect', p: 'onboard', set: { pstage: 'accepted' }, hl: 'pay', t: 'Avery has signed the contract and code of conduct, and now sets up installment payments.' },
    { r: 'prospect', p: 'onboard', set: { pstage: 'accepted' }, m: 'onboardSurvey', hl: 'finish-onboard', t: 'Completes the onboarding survey and becomes a Fellow.' },
    { r: 'fellow', p: 'modules', hl: 'career-clarity', t: 'As a Fellow, the application essays seed Module 1: Career Clarity, and the resume is already attached for job applications.' }
  ]},
  { id: 'infraction', title: 'PM issues an infraction, fellow sees it', roles: ['pm', 'fellow'], steps: [
    { r: 'pm', p: 'exits', hl: 'issue-infraction', t: 'An auto rule flags Jordan for a missed coach call. Priya clicks "Issue infraction".' },
    { r: 'pm', p: 'exits', m: 'infraction', hl: 'send-infraction', t: 'Picks the type, writes what happened and what Jordan should do, and issues it (1 of 3).' },
    { r: 'fellow', p: 'dashboard', hl: 'infraction-banner', t: 'Jordan sees an in-app notice at the top of the dashboard (and gets an email).' },
    { r: 'fellow', p: 'status', hl: 'infraction-list', t: 'On Program Status, Jordan sees the infraction, acknowledges it, and checks the upcoming deadlines.' }
  ]},
  { id: 'dismiss', title: 'MLT dismisses a fellow', roles: ['coach', 'pm'], steps: [
    { r: 'coach', p: 'fellows', m: 'flagExit', t: 'Optional: a coach flags a fellow for review. Rules can also flag fellows automatically.' },
    { r: 'pm', p: 'exits', hl: 'dismiss-row', t: 'Sam has reached 3 infractions for missed coach calls, so Sam is in the dismissal review queue with the evidence attached.' },
    { r: 'pm', p: 'exits', m: 'dismiss', hl: 'confirm-dismiss', t: 'Priya selects the reasons, sets the effective date and appeal window, and confirms. The fellow and coach are notified.' }
  ]}
];
</script>
<script>/* pages.js */
// Wireframe primitives + first half of page renderers.
const at = o => (o.hl ? ` data-hl="${o.hl}"` : '') + (o.go ? ` data-go="${o.go}"` : '') + (o.modal ? ` data-modal="${o.modal}"` : '') + (o.close ? ' data-close="1"' : '');
const W = (l, inner, o = {}) => `<div class="wf ${o.c || ''}" data-l="${l}"${at(o)}${o.s ? ` style="${o.s}"` : ''}>${inner}</div>`;
const B = (t, o = {}) => `<button class="btn ${o.p ? 'p' : ''} ${o.sm ? 'sm' : ''}"${at(o)}>${t}</button>`;
const I = (ph, c = '') => `<div class="inp ${c}">${ph}</div>`;
const F = (l, ph, c = '') => `<div class="fld">${l}${I(ph, c)}</div>`;
const L = (...c) => c.map(x => `<div class="ln ${x}"></div>`).join('');
const IMG = (l, h = 80) => `<div class="img" style="height:${h}px">${l}</div>`;
const C = (t, c = '') => `<span class="chip ${c}">${t}</span>`;
const T = (cols, rows) => `<div class="tblw"><table class="tbl"><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>${rows.map(r => `<tr${r.hl ? ` data-hl="${r.hl}" style="position:relative"` : ''}>${(r.c || r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const HDR = (title, sub, actions = '') => `<div class="ph-h"><h1>${title}</h1><div class="row">${actions}</div><p>${sub}</p></div>`;
const ITEM = (b, s, right = '', o = {}) => `<div class="item"${at(o)} style="position:relative">${o.chk !== undefined ? `<span class="chk ${o.chk ? 'x' : ''}"></span>` : ''}${o.av ? `<span class="av">${o.av}</span>` : ''}<div class="t"><b>${b}</b><span>${s}</span></div>${right}</div>`;
const D = (t, hot) => `<span class="due ${hot ? 'hot' : ''}">${t}</span>`;
const KPI = (n, l, hint = '') => W('KPI tile', `<div class="kpi"><b>${n}</b><span>${l}</span>${hint ? `<div style="margin-top:6px">${C(hint, 'g')}</div>` : ''}</div>`);
const DUESTRIP = items => W('Due soon · sorted by date', items.map(i => ITEM(i[0], i[1], D(i[2], i[3]), { hl: i[4], chk: false })).join(''), { c: 'key' });
const SEARCH = (ph = 'Search…') => `<div class="row" style="margin-bottom:16px">${I('⌕ ' + ph).replace('class="inp ', 'class="inp sp ')}${I('Filter ▾')}${I('Sort ▾')}</div>`;

const P = {};

// Coach cohorts: fellows are grouped by expected graduation year.
const COHORTS = {
  all:  { label: 'All cohorts',   n: 150, today: 14, week: 68, month: 245, notes: '92%', fb: '4.7', need: 38 },
  2027: { label: 'Class of 2027', n: 64,  today: 6,  week: 29, month: 104, notes: '95%', fb: '4.8', need: 15 },
  2028: { label: 'Class of 2028', n: 86,  today: 8,  week: 39, month: 141, notes: '89%', fb: '4.6', need: 23 }
};
const COHORT_TOGGLE = () => `<div class="seg">${['all', '2027', '2028'].map(k => `<button data-cohort="${k}" class="${String(S.cohort) === k ? 'on' : ''}">${k === 'all' ? 'All' : 'Class of ' + k}</button>`).join('')}</div>`;

P.login = () => `
<div style="max-width:420px;margin:30px auto" class="stack">
  ${IMG('Logo', 60)}
  ${W('Login form', `<h3>Welcome to the MLT Fellow Portal</h3>
    <div class="stack" style="gap:10px">${F('Email', 'name@school.edu')}${F('Password', '••••••••')}
    <div class="row">${B('Log in', { p: 1, go: 'dashboard' })}<span class="sp"></span><u style="font-size:11px">Forgot password?</u></div>
    <div class="row" style="justify-content:center;color:var(--ink3);font-size:11px">or</div>
    ${B('Continue with SSO (Google / Microsoft)', { go: 'dashboard' })}</div>`)}
  ${W('Invite acceptance (from email link)', `<div style="font-size:12px;margin-bottom:10px">You were invited as <b>Fellow</b> · Career Prep 2027 · Coach: Marcus T.</div>
    <div class="stack" style="gap:10px">${F('Create password', '••••••••')}${B('Accept invite & set up profile →', { p: 1, go: 'dashboard' })}</div>`, { hl: 'accept', c: 'dash' })}
  ${W('Create account · prospects', `<div style="font-size:12px;margin-bottom:10px">New to MLT? Create an account, add your education and work experience, then start your application.</div><div class="g2" style="gap:10px">${F('Name', 'First + last')}${F('Password', '••••••••')}</div><div style="margin-top:10px">${EMAILS()}</div><div class="row" style="margin-top:10px"><button class="btn p" data-jump="prospect|programs">Create account &amp; choose a program →</button></div>`)}
  ${W('Sign-up link', `<div class="row" style="font-size:12px">Company partner without an invite?<span class="sp"></span>${B('Request access', { sm: 1 })}</div>`)}
</div>`;

P.dashboard = r => {
  const greet = HDR(`Good afternoon, ${ROLES[r].who.split(' ')[0]}`, `Thursday, Oct 29 · ${ROLES[r].sub}`, B('Notifications (3)', { sm: 1 }));
  if (r === 'fellow') return greet + `<div class="stack">
    ${W('In-app notice · infraction', `<div class="row"><span class="due hot">!</span><div class="sp"><b style="font-size:12.5px">Infraction 1 of 3: Missed coach call (Oct 20)</b><div style="font-size:11px;color:var(--ink2)">Book a make-up call by Nov 5 to stay on track.</div></div>${B('View Program Status', { sm: 1, p: 1, go: 'status' })}${B('Book make-up call', { sm: 1, go: 'schedule' })}</div>`, { c: 'key fill', hl: 'infraction-banner' })}
    ${DUESTRIP([['Update resume with STAR bullets', 'Task from Coach Marcus · from Oct 27 call', 'TOMORROW', 1, 'task-due'], ['Module 3: Networking Fundamentals', 'Assignment · 2 of 4 lessons done', 'NOV 2', 1], ['Acme Corp Summer Analyst', 'Application deadline · saved', 'NOV 6'], ['Post-call feedback for Oct 27 call', 'Required within 7 days', 'NOV 3'], ['Pre-event survey: Fall Recruiting Summit', 'Event Nov 12 · +1 infraction if missed', 'NOV 10']])}
    <div class="g2">
      ${W('Next coach call', `<div class="row"><span class="av">MT</span><div class="sp"><b>Marcus T.</b><div style="font-size:11px;color:var(--ink2)">Tue Nov 3 · 4:00 PM · Zoom</div></div></div><div class="row" style="margin-top:12px">${B('Join', { sm: 1, p: 1 })}${B('Reschedule', { sm: 1, go: 'schedule' })}${B('Coach profile', { sm: 1, go: 'coachinfo' })}</div>`)}
      ${W('Career journey progress', `<div class="row" style="font-size:11px;margin-bottom:6px"><b>Milestone 2 of 5</b><span class="sp"></span>40%</div><div class="bar"><i style="width:40%"></i></div><div class="row" style="margin-top:10px;font-size:11px;color:var(--ink2)">${C('✓ Onboarding')}${C('● Story & Brand', 'd')}${C('Networking')}${C('Applications')}${C('Offer')}</div>`)}
    </div>
    <div class="g2">
      ${W('Application tracker', ITEM('Acme Corp · Summer Analyst', 'Applied today', C('Submitted', 'd'), { hl: 'app-status' }) + ITEM('Globex · SWE Intern', 'Applied Oct 12', C('Interviewing')) + ITEM('Initech · Ops Intern', 'Applied Oct 2', C('Under review')) + `<div style="margin-top:8px">${B('View all applications', { sm: 1, go: 'jobs' })}</div>`)}
      ${W('My notes (private follow-ups)', ITEM('Email Acme recruiter thank-you', 'Added Oct 26', '', { chk: false }) + ITEM('Ask Marcus about case interviews', 'Added Oct 24', '', { chk: true }) + `<div class="row" style="margin-top:8px">${I('+ Add a note or follow-up…').replace('class="inp ', 'class="inp sp ')}</div>`)}
    </div>
    ${W('Notes from Coach Marcus · fellow-facing', `<div class="row" style="margin-bottom:8px"><b style="font-size:12.5px" class="sp">Oct 29 call · resume review</b>${C('Shared with you')}</div>${L('m', '', 's')}<div style="font-size:11px;color:var(--ink2);margin-top:8px">Next steps: STAR bullets on 3 experiences · send by Oct 30</div><div class="row" style="margin-top:10px">${B('View all coach notes', { sm: 1 })}</div>`, { hl: 'coach-notes' })}
    </div>`;
  if (r === 'coach') {
    const c = COHORTS[S.cohort];
    return HDR(`Good afternoon, Marcus`, `Thursday, Oct 29 · ${c.n} assigned fellows${S.cohort === 'all' ? ' across 2 cohorts' : ' · ' + c.label} · Program Track: Finance`, COHORT_TOGGLE() + B('Notifications (3)', { sm: 1 })) + `<div class="stack">
    ${DUESTRIP([['Call notes owed: Aisha B.', 'Call ended Oct 28 · notes due within 48h', 'TODAY', 1], ['Review Jordan\'s resume task', 'Task assigned Oct 27', 'OCT 30', 1], ['Monthly caseload check-in', 'Program requirement', 'NOV 1']])}
    <div class="g4">
      ${W('KPI tile · Calls', `<div class="row" style="gap:0;justify-content:space-between">${[[c.today, 'Today'], [c.week, 'This week'], [c.month, 'This month']].map(x => `<div class="kpi" style="text-align:center;flex:1"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('<div style="width:1px;align-self:stretch;background:var(--soft)"></div>')}</div>`)}
      ${KPI(c.notes, 'Calls with notes', 'Target 90%')}
      ${W('KPI tile · Feedback', `<div class="kpi"><b>${c.fb}</b><span>Avg fellow feedback · cohort aggregate</span></div><div style="height:22px;margin-top:6px;border-bottom:1px solid var(--soft);background:linear-gradient(to top right,transparent 48%,var(--ink2) 49%,var(--ink2) 51%,transparent 52%)"></div><div style="margin-top:8px">${B('See trends →', { sm: 1, go: 'coachstats' })}</div>`)}
      ${W('KPI tile · Scheduling', `<div class="kpi"><b>${c.need}</b><span>Fellows who need to schedule a call this month</span></div><div style="margin-top:8px">${B('Nudge fellows →', { sm: 1, p: 1, go: 'nudge' })}</div>`, { c: 'key' })}
    </div>
    <div class="g2">
      ${W('Today\'s calls', ITEM('Jordan A. · 1:1 coach call', '4:00 PM · Class of 2028 · agenda: resume review', B('Open', { sm: 1, go: 'fellows' }), { av: 'JA', hl: 'coach-upcoming' }) + ITEM('Office hours (group)', '6:00 PM · 3 signed up', B('Open', { sm: 1 }), { av: 'OH' }))}
      ${W('Fellows needing attention', ITEM('Sam P.', 'No call booked in 30 days', C('Flag', 'd'), { av: 'SP' }) + ITEM('Lee W.', '2 overdue assignments', C('Flag', 'd'), { av: 'LW' }) + ITEM('Riya M.', 'Asked you a question · 1d', C('Reply'), { av: 'RM' }))}
    </div></div>`;
  }
  if (r === 'pm') return greet + `<div class="stack">
    ${DUESTRIP([['Approve 3 pending job postings', 'Approvals queue', 'TODAY', 1], ['Cohort milestone: Story & Brand', 'Module 3 due for all fellows', 'NOV 2', 1], ['Quarterly account review: Acme Corp', 'Relationship check-in', 'NOV 9']])}
    <div class="g4">${KPI('2,412', 'Active fellows · Class of 2027')}${KPI('87%', 'Coach compliance', '2 below target')}${KPI('74%', 'Fellow compliance', '↓ 3 pts')}${KPI('31', 'Open approvals')}</div>
    <div class="g2">
      ${W('Compliance flags', T(['Who', 'Issue', ''], [['Coach · R. Diaz', '3 calls without notes', B('Nudge', { sm: 1, go: 'nudge' })], ['Fellow · Sam P.', 'No call in 30 days', B('Nudge', { sm: 1, go: 'nudge' })], ['Fellow · Lee W.', '2 overdue modules', B('Nudge', { sm: 1, go: 'nudge' })]]))}
      ${W('Chart: weekly calls completed vs. required', IMG('Line chart placeholder', 150))}

  if (r === 'admin') return greet + `<div class="stack">
    ${DUESTRIP([['SSO certificate renewal', 'Settings › Integrations', 'NOV 4', 1], ['Review 2 pending sign-ups', 'Approvals queue', 'TODAY', 1]])}
    <div class="g4">${KPI('9,862', 'Total users')}${KPI('6', 'Programs')}${KPI('44', 'Partner accounts')}${KPI('6 / 7', 'Integrations healthy')}</div>

      ${W('Integration status', ['Salesforce sync', 'Cvent (events + registrations)', 'Zoom', 'Google Calendar', 'Outlook Calendar', 'AI notes service', 'Email (SendGrid)'].map((n, i) => ITEM(n, i === 5 ? 'Error · last sync 6h ago' : 'Healthy · synced 5m ago', C(i === 5 ? 'Error' : 'OK', i === 5 ? 'd' : ''))).join(''))}
      ${W('Recent activity log', T(['When', 'Event'], [['3:12 PM', REP() + ' posted a job (Acme)'], ['2:40 PM', 'Priya R. approved 2 sign-ups'], ['1:05 PM', 'New program "Ascend 2027" created']]))}
    </div></div>`;
  const t = S.tier;
  const applicants = W('Applicants · Summer Analyst Intern (L1+)', T(['Fellow', 'School · Major', 'Applied', ''], [['Jordan A.' + BADGE_STRIP('Jordan A.'), 'State U · Finance · \'28', 'Oct 29', B('Profile', { sm: 1 })], ['Aisha B.', 'Tech Inst. · Econ · \'27', 'Oct 26', B('Profile', { sm: 1 })], ['Riya M.', 'City College · CS · \'28', 'Oct 24', B('Profile', { sm: 1 })]]) + `<div class="row" style="margin-top:10px">${B('View all 42 applicants', { sm: 1, go: 'accounts' })}${B('Export', { sm: 1 })}</div>`);
  const eligible = t >= 2 ? W('Eligible fellows who haven\'t applied (L2+)', `<div style="font-size:11px;color:var(--ink2);margin-bottom:6px">Fellows whose major, grad year, and interests match your live postings</div>` + [['Sam P.', 'State U · Finance · \'28 · interests: banking', 'SP'], ['Lee W.', 'Tech Inst. · Econ · \'28 · interests: consulting', 'LW'], ['Taylor N.', 'City College · Math · \'27', 'TN']].map(f => ITEM(f[0], f[1], B('Message', { sm: 1, go: 'messages' }), { av: f[2] })).join('') + `<div class="row" style="margin-top:8px">${B('Browse all 118 eligible fellows', { sm: 1 })}${C('Match filters ▾')}</div>`, { c: 'key' }) :
    W('Eligible fellows (locked)', `<div style="font-size:12px;color:var(--ink2)">Available at Level 2. Contact your MLT Program Manager to upgrade.</div>`, { c: 'dash' });
  const bench = t >= 3 ? W('Benchmarks · your postings vs. the site (Premier, L3)', `<div class="g4">${[['42', 'Applicants per posting', 'Site avg 28 · top 15%'], ['18%', 'View → apply rate', 'Site avg 12%'], ['9 days', 'Avg time to first applicant', 'Site avg 14 days'], ['3.1×', 'Saves vs. site avg', 'Rank 4 of 41']].map(k => KPI(k[0], k[1], k[2])).join('')}</div>
      <div class="g2" style="margin-top:16px">${W('Chart: applicants per posting · you vs. site average', IMG('Bar chart placeholder', 140))}${W('Table: posting-level comparison', T(['Posting', 'You', 'Site avg', 'Percentile'], [['Summer Analyst', '42', '28', '85th'], ['Ops Analyst', '25', '28', '45th'], ['Data Intern', '—', '31', 'In review']]))}</div>`, { c: 'key' }) :
    W('Benchmarks (locked)', `<div style="font-size:12px;color:var(--ink2)">See how your postings perform against the rest of the site. Available for Premier partners (Level 3).</div>`, { c: 'dash' });
  return greet + `<div class="stack">
    <div class="row">${C('Portal access: ' + TIERS[t].label + ' · ' + TIERS[t].name, 'd')}<span style="font-size:11px;color:var(--ink2)">${TIERS[t].sub}</span></div>
    ${DUESTRIP([['Summer Analyst posting closes', '42 applicants · review before close', 'NOV 6', 1], ['Posting pending approval: Data Intern', 'Submitted Oct 28', 'IN REVIEW']])}
    <div class="g3">${KPI('3', 'Live postings')}${KPI('67', 'Total applicants')}${KPI('2', 'Unread messages')}</div>
    ${t >= 3 ? bench : ''}
    <div class="g2">${applicants}${eligible}</div>
    ${t < 3 ? bench : ''}
    </div>`;
};

P.users = () => HDR('User Management', 'Every account on the platform. One role per user.', B('Export CSV', { sm: 1 }) + B('+ Invite user', { p: 1, modal: 'invite', hl: 'invite' })) +
  SEARCH('Search name or email') +
  `<div class="row" style="margin-bottom:14px">${['All 9,862', 'Admins 4', 'Program Managers 12', 'Coaches 64', 'Fellows 9,738', 'Company Reps 44'].map((x, i) => C(x, i ? '' : 'd')).join('')}</div>` +
  W('Data table: users', T(['Name', 'Emails', 'Role', 'Program', 'Status', ''], [
    { hl: 'invited-row', c: ['Taylor N.', 'taylor@school.edu', C('Fellow'), 'Career Prep 2027', C('Invited', 'd'), B('Resend', { sm: 1 })] },
    ['Jordan A.', 'jordan@state.edu<br><span style="color:var(--ink2)">jordan.a@gmail.com</span>', C('Fellow'), 'Career Prep 2027', C('Active'), B('Edit', { sm: 1 })],
    ['Marcus T.', 'marcus@mlt.org', C('Coach'), 'Career Prep 2027', C('Active'), B('Edit', { sm: 1 })],
    ['Priya R.', 'priya@mlt.org', C('Program Manager'), 'Career Prep 2027', C('Active'), B('Edit', { sm: 1 })],
    [REP(), 'kim@acme.com', C('Company Rep'), 'Acme Corp', C('Active'), B('Edit', { sm: 1 })]
  ]) + `<div class="row" style="margin-top:12px;font-size:11px;color:var(--ink2)">Showing 1–25 of 9,862 · ‹ 1 2 3 … 395 ›<span class="sp"></span>Bulk: ${B('Change role', { sm: 1 })} ${B('Deactivate', { sm: 1 })}</div>`) + `<div style="margin-top:18px">${DUPES()}</div>`;

P.approvals = r => HDR('Requests & Approvals', r === 'admin' ? 'All programs' : 'Career Prep 2027 only', '') +
  `<div class="row" style="margin-bottom:16px">${C('All 7', 'd')}${C('Job postings 3')}${C('Coach reassignments 2')}${C('Sign-ups 2')}</div>` +

<script>/* pages3.js */
// MLT Assistant: an LLM chat harness available to every role. Answers are scoped to what the asker can already access.
const AI_SCOPE = {
  fellow: [`Your profile, tasks, modules, and applications`, `Fellow-facing coach notes`, `Live job postings`, `MLT guides and interview prep library`],
  coach: [`Your assigned fellows only (profiles, tasks, applications)`, `Your call notes, private and fellow-facing`, `Cohort-level feedback averages (5+ responses)`],
  company: [`Your account, postings, and applicants`, `Eligible fellows (Level 2+)`, `Site benchmarks (Level 3 only)`, `MLT posting guidelines`],
  pm: [`All fellows, coaches, and accounts in your program`, `Compliance, infractions, and exits`, `Individual call ratings`],
  admin: [`Platform-wide usage and integration logs`, `All programs (read-only)`]
};
const AI_NEVER = [`1:1 message content`, `Data from roles or accounts you cannot access`];

const ACT = (t, o = {}) => B(t, Object.assign({ sm: 1 }, o));
const AI_CONVOS = {
  fellow: [
    { q: `How do I complete this assignment?`, ctx: `M3 · Networking target list`, a: `<p>For <b>Build a networking target list (10 contacts)</b>, due Nov 2:</p><ol style="margin:6px 0 6px 18px;padding:0;font-size:12px"><li>Pick 3 target companies (you have saved Acme, Globex, Initech).</li><li>Find 3 or 4 people at each on LinkedIn: alumni, MLT alumni, recruiters.</li><li>Fill in the template: name, role, how you are connected, outreach date.</li><li>Upload it as a PDF or sheet link.</li></ol><p style="font-size:11px;color:var(--ink2)">I can explain and guide you, but I won't do graded work for you.</p>`, acts: ACT(`Open assignment`, { go: 'modules' }) + ACT(`Download template`) + ACT(`Ask my coach`, { go: 'messages' }) },
    { q: `How do I ask to reschedule an interview with Acme?`, ctx: `Application · Summer Analyst Intern`, a: `<p>Reply quickly, give a reason in one line, and offer 2 or 3 specific times. Here is a draft:</p>${W('Draft email', `<div style="font-size:12px;line-height:1.5">Hi Kim,<br>Thank you for the invitation to interview for the Summer Analyst role. I have a conflict with a required exam on Nov 4. Would any of these times work instead: Nov 5 at 10 AM, Nov 5 at 2 PM, or Nov 6 at 11 AM?<br>Thank you,<br>Jordan</div>`, { c: 'fill', hl: 'ai-draft' })}`, acts: ACT(`Copy`) + ACT(`Edit draft`) + ACT(`Send via Messages`, { p: 1, go: 'messages', hl: 'ai-send' }) },
    { q: `What kinds of questions should I expect from a Round 2 interview with Acme?`, ctx: `Interview prep`, a: `<p>Round 2 at Acme is usually 2 back-to-back interviews, about 45 minutes each:</p><ul style="margin:6px 0 6px 18px;padding:0;font-size:12px"><li><b>Behavioral:</b> leadership, teamwork, a time you failed</li><li><b>Technical:</b> walk through a DCF, accounting basics</li><li><b>Fit:</b> why Acme, why this division</li></ul><p style="font-size:11px;color:var(--ink2)">Based on reports from 14 MLT fellows (2024 to 2026) and public sources. These are not Acme's official questions.</p>`, acts: ACT(`Start mock interview`, { p: 1 }) + ACT(`See fellow reports`) + ACT(`Add prep to my notes`) }
  ],
  coach: [
    { q: `How many of my fellows applied to the Internship role at Acme?`, ctx: `My fellows · Applications`, a: `<p><b>9 of your 150 fellows</b> applied to <b>Summer Analyst Intern</b> at Acme Corp.</p>${T(['Status', 'Class of 2027', 'Class of 2028'], [['Submitted', '2', '3'], ['Under review', '1', '1'], ['Interviewing', '1', '1']])}<p style="font-size:11px;color:var(--ink2);margin-top:6px">17 more of your fellows match the posting but have not applied. It closes Nov 6.</p>`, acts: ACT(`Open list in My Fellows`, { go: 'fellows' }) + ACT(`Nudge the 17`, { p: 1, go: 'nudge' }) + ACT(`Export`) },
    { q: `Do I have any fellows who go to school in Michigan?`, ctx: `My fellows · Profiles`, a: `<p>Yes. <b>11 of your fellows</b> attend schools in Michigan:</p>${ITEM('University of Michigan', 'Class of 2027: 2 · Class of 2028: 4', C('6'))}${ITEM('Michigan State University', 'Class of 2028: 3', C('3'))}${ITEM('Wayne State University', 'Class of 2027: 2', C('2'))}`, acts: ACT(`View these 11 fellows`, { go: 'fellows' }) + ACT(`Message all 11`) },
    { q: `How has my feedback trended this term?`, ctx: `Coaching Insights`, a: `<p>Your cohort average rose from <b>4.5 to 4.7</b> since May. "Clear next steps" is the most common theme. Individual ratings stay hidden.</p>${IMG('Mini line chart', 70)}`, acts: ACT(`Open Coaching Insights`, { go: 'coachstats' }) }
  ],
  company: [

    { q: `Summarize the top withdrawal reasons this term.`, ctx: `Fellow Exits`, a: `<p>Of 31 withdrawals: <b>offer outside MLT</b> (12), <b>time commitment</b> (9), <b>program fit</b> (6), other (4). Time commitment is up 5 vs. last term, mostly from sophomores.</p>`, acts: ACT(`Open Fellow Exits`, { go: 'exits' }) }
  ],
  admin: [
    { q: `Which integrations failed in the last 24 hours?`, ctx: `Settings · Integrations`, a: `<p><b>AI notes service</b> failed 14 times since 9 AM (auth token expired). Everything else is healthy.</p>`, acts: ACT(`Reconnect`, { p: 1, go: 'settings' }) + ACT(`View log`) },
    { q: `How many users signed up last week, by role?`, ctx: `User Management`, a: `${T(['Role', 'New users'], [['Fellow', '412'], ['Company Rep', '6'], ['Coach', '3']])}`, acts: ACT(`Open User Management`, { go: 'users' }) }
  ]
};

P.assistant = r => {
  const convos = AI_CONVOS[r], c = convos[Math.min(S.aq, convos.length - 1)];
  const scope = r === 'company' ? AI_SCOPE.company.filter(x => !(S.tier < 2 && x.includes('Level 2')) && !(S.tier < 3 && x.includes('Level 3'))) : AI_SCOPE[r];
  const ans = typeof c.a === 'function' ? c.a() : c.a;

        <div class="wf dash" data-l="AI answer" style="margin-top:8px">${ans}<div class="row" style="margin-top:12px;border-top:1px dashed var(--soft);padding-top:10px">${c.acts}<span class="sp"></span>${B('👍', { sm: 1 })}${B('👎', { sm: 1 })}</div></div>
      </div>
      <div style="font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px">Suggested for ${ROLES[r].label.toLowerCase()}s</div>
      <div class="row" style="gap:6px">${convos.map((x, i) => `<button class="chip ${i === S.aq ? 'd' : ''}" data-aq="${i}" style="cursor:pointer">${x.q}</button>`).join('')}</div>
      <div class="row" style="border-top:1px solid var(--soft);padding-top:10px;margin-top:12px">${B('📎', { sm: 1 })}${I('Ask anything about your program…').replace('class="inp ', 'class="inp sp ')}${B('Send', { p: 1, sm: 1 })}</div>
      <div style="font-size:10px;color:var(--ink2);margin-top:8px">AI can make mistakes. Check important details. ${r === 'fellow' || r === 'company' ? 'Need a person? ' + B('Talk to MLT staff', { sm: 1 }) : ''}</div>`, { c: 'key' })}

</script>

<script>/* pages5.js */
// Events: registration lives in Cvent; the portal handles nudges and pre/post-event surveys.
const EVENTS = [
  { t: `Fall Recruiting Summit`, d: `Thu Nov 12 · 9 AM to 4 PM ET`, where: `New York, NY + virtual`, aud: `Fellows + company reps`, phase: `pre`, reg: [612, 2412], pre: [388, 612], post: [0, 0], cos: [31, 44] },
  { t: `Finance Track Networking Night`, d: `Thu Nov 19 · 6 to 8 PM ET`, where: `Virtual (Zoom)`, aud: `Finance fellows + partner reps`, phase: `pre`, reg: [214, 820], pre: [90, 214], post: [0, 0], cos: [12, 18] },
  { t: `Resume & LinkedIn Workshop`, d: `Thu Oct 22 · 7 PM ET`, where: `Virtual (Zoom)`, aud: `Fellows`, phase: `post`, reg: [540, 2412], pre: [470, 540], post: [301, 498], cos: [0, 0] }
];
const pct = ([a, b]) => b ? Math.round(a / b * 100) : 0;

const EVENT_LIST = r => W('Event list', `<div class="row" style="margin-bottom:10px">${C('Upcoming 2', 'd')}${C('Past 1')}</div>` + EVENTS.map((e, i) => `<div class="item" data-ev="${i}" style="cursor:pointer;${S.ev === i ? 'background:var(--fill);border-radius:6px;padding-left:6px' : ''}"><div class="img" style="width:40px;height:40px;flex:none">${e.d.split(' ')[1]}<br>${e.d.split(' ')[2]}</div><div class="t"><b>${e.t}</b><span>${e.d} · ${e.where}</span></div>${e.phase === 'post' ? C('Past', 'g') : ''}</div>`).join(''));

const EVENT_HEAD = (e, r) => W('Event detail', `<div class="row" style="align-items:flex-start"><div class="sp"><b style="font-family:var(--display);font-size:19px">${e.t}</b><div style="font-size:12px;color:var(--ink2);margin-top:2px">${e.d} · ${e.where}</div><div class="row" style="margin-top:8px">${C('For: ' + e.aud)}${C('Registration in Cvent', 'g')}</div></div><div class="img" style="width:130px;height:64px;flex:none">Event banner</div></div>${L('m', 's')}`, { c: 'key' });

// Fellow + company rep view: register in Cvent, complete their own version of each survey.
const EVENT_ATTENDEE = (e, r) => {

  const pastEv = e.phase === 'post';
  return `<div class="stack">${EVENT_HEAD(e, r)}
    <div class="g2">
      ${W('Registration (Cvent)', pastEv ? `<div style="font-size:12px">You attended ✓ <span style="color:var(--ink2)">(synced from Cvent)</span></div>` : `<div style="font-size:12px;margin-bottom:10px">${r === 'fellow' ? 'Registered ✓ · synced from Cvent' : 'Not registered yet. Registration covers your booth and table.'}</div><div class="row">${B(`${r === 'fellow' ? 'Fellow' : 'Company rep'} registration on Cvent ↗`, { sm: 1, p: r !== 'fellow', hl: 'cvent' })}${r === 'fellow' ? B('Add to calendar', { sm: 1 }) : ''}</div><div style="font-size:10.5px;color:var(--ink2);margin-top:8px">Opens the ${who.toLowerCase()} registration page in Cvent. Your status syncs back here.</div>`)}

    </div>

};

// Staff view: tracking for everyone; survey builder for PM + Admin; nudges for PM + Coach.
const EVENT_STAFF = (e, r) => {
  const mine = r === 'coach';

  const ed = r !== 'coach';
  const builder = W(ed ? 'Survey builder' : 'Survey questions · preview (read-only)', `<div class="row" style="margin-bottom:12px">${['pre', 'post'].map(k => `<button class="chip ${S.svType === k ? 'd' : ''}" data-svtype="${k}" style="cursor:pointer">${k === 'pre' ? 'Pre-event' : 'Post-event'}</button>`).join('')}<span style="width:12px"></span>${['fellow', 'company'].map(k => `<button class="chip ${S.svAud === k ? 'd' : ''}" data-svaud="${k}" style="cursor:pointer">${k === 'fellow' ? 'Fellow version' : 'Company rep version'}</button>`).join('')}</div>
      ${SURVEY_QS().map((q, i) => `<div class="row" style="border:1.5px dashed var(--ink3);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px"><span style="font-family:var(--mono);font-size:10px">Q${i + 1}</span><span class="sp">${q[0]}</span>${C(q[1])}${ed ? B('Edit', { sm: 1 }) : ''}</div>`).join('')}

    : [['Fellows', `${pct(e.reg)}% registered`, `${pct(e.pre)}% done`, e.phase === 'post' ? `${pct(e.post)}% done` : 'Not open', canNudge ? B('Nudge', { sm: 1, p: 1, modal: 'eventNudge', hl: 'event-nudge' }) : ''], ['Company reps', `${e.cos[0]} of ${e.cos[1]} accounts`, e.cos[1] ? '74% done' : '—', 'Not open', canNudge && e.cos[1] ? B('Nudge', { sm: 1, modal: 'eventNudge' }) : '']];
  return `<div class="stack">${EVENT_HEAD(e, r)}
    <div class="row">${B('Open event in Cvent ↗', { sm: 1 })}${B('Fellow registration link ↗', { sm: 1 })}${B('Company rep registration link ↗', { sm: 1 })}<span class="sp"></span>${canNudge ? B(mine ? 'Nudge my fellows' : 'Nudge non-completers', { sm: 1, p: 1, modal: 'eventNudge' }) : ''}</div>
    ${W(`Survey completion tracking${mine ? ' · your 150 fellows' : ''}`, `<div class="g3">${[MEASURE('Registered (Cvent)', reg), MEASURE('Pre-event survey', pre, 'of registered'), MEASURE('Post-event survey', post, e.phase === 'post' ? 'of attendees' : 'opens after event')].map(x => `<div>${x}</div>`).join('')}</div>${T([mine ? 'Fellow' : 'Group', 'Registration', 'Pre-survey', 'Post-survey', ''], rows)}`, { hl: 'survey-tracking' })}
    ${builder}
    ${W(mine ? 'Survey results · your fellows' : 'Survey results', IMG(mine ? 'Results charts placeholder · your fellows only (aggregate)' : 'Results charts placeholder · split by fellow and company rep versions', 120))}

};

const SURVEY_QS = (k = S.svType + '-' + S.svAud) => ({
  'pre-fellow': [['What do you most want from this event?', 'Multiple choice'], ['Which companies do you plan to visit?', 'Checkboxes'], ['How confident are you networking? (1 to 5)', 'Scale'], ['Accessibility or dietary needs', 'Short text']],
  'pre-company': [['How many reps will attend?', 'Number'], ['Roles you are recruiting for', 'Checkboxes'], ['What fellow profiles are you looking for?', 'Long text']],
  'post-fellow': [['Overall, how useful was the event? (1 to 5)', 'Scale'], ['Did you get a follow-up or interview?', 'Yes / No'], ['What should we change?', 'Long text']],

P.events = r => {
  const e = EVENTS[S.ev] || EVENTS[0];

<script>/* pages6.js */
// Prospect role: account + basics → program application → decision → enrollment (contract, conduct, fee, survey) → Fellow.
const PSTAGES = { applying: `Applying`, submitted: `Submitted`, accepted: `Accepted` };
const APP_STEPS = [[`Account + basics`, `Education, work experience`], [`Resume`, `PDF or DOCX`], [`Transcripts`, `Unofficial is fine`], [`Elevator pitch`, `60 to 90 sec video`], [`Short answers + essays`, `3 prompts`], [`Review + submit`, `Due Dec 1`]];
const ESSAYS = [[`What career are you working toward, and why?`, 300], [`Tell us about a challenge you overcame and what it taught you.`, 300], [`What do you hope to get from MLT, and what will you contribute?`, 200]];

const PROSPECT_DASH = () => {
  const st = S.pstage;
  const head = HDR(`Welcome, Avery`, `Prospect · ${PROG().n} · Application deadline ${PROG().dl}`, B('Notifications (1)', { sm: 1 }));
  if (st === 'accepted') return head + `<div class="stack">
    ${W('Decision', `<div class="row"><div class="sp"><b style="font-family:var(--display);font-size:21px">You're accepted to MLT Career Prep 🎉</b><div style="font-size:12px;color:var(--ink2)">Finish enrollment by Nov 20 to become a Fellow and get matched with your coach.</div></div>${B('Finish enrollment →', { p: 1, go: 'onboard' })}</div>`, { c: 'key fill' })}
    ${DUESTRIP([['Sign program contract', 'E-signature · about 5 minutes', 'NOV 13', 1], ['Accept the code of conduct', 'Read + acknowledge', 'NOV 13', 1], ['Program fee: pay in full or set up installments', 'Fee assistance available', 'NOV 20'], ['Onboarding survey', '10 questions', 'NOV 20']])}
  </div>`;
  const done = st === 'submitted' ? 6 : 3;
  return head + `<div class="stack">
    ${st === 'submitted' ? W('Application status', `<div class="row"><div class="sp"><b style="font-size:14px">Submitted Oct 28 · under review</b><div style="font-size:11px;color:var(--ink2)">Decisions go out by Jan 15. We'll email you and post it here.</div></div>${C('Under review', 'd')}</div>`, { c: 'key' }) :
      DUESTRIP([['Record your elevator pitch', 'Application step 4 of 6', 'DEC 1', 1], ['Write 3 short answers', 'Application step 5 of 6', 'DEC 1', 1], ['Info session: Is MLT right for me?', 'Optional · virtual', 'NOV 5']])}
    <div class="g2">
      ${W('Application progress', `<div class="row" style="font-size:11px;margin-bottom:6px"><b>${done} of 6 steps</b><span class="sp"></span>${Math.round(done / 6 * 100)}%</div><div class="bar"><i style="width:${done / 6 * 100}%"></i></div><div style="margin-top:10px">${B(st === 'submitted' ? 'View my application' : 'Continue application →', { sm: 1, p: 1, go: 'apply' })}</div>`)}
      ${W('What happens next', [['Submit', 'by Dec 1'], ['Review', 'AI check, then human reviewers'], ['Decision', 'by Jan 15'], ['Enroll', 'contract, conduct, fee, survey']].map((x, i) => ITEM(x[0], x[1], '', { chk: st === 'submitted' ? i < 1 : false })).join(''))}
    </div></div>`;
};
const _dashboard = P.dashboard;
P.dashboard = r => r === 'prospect' ? PROSPECT_DASH() : _dashboard(r);

P.apply = r => {
  if (r !== 'prospect') return HDR('Application', '', '') + '';
  const sub = (S.pstage === 'applying' ? `Applying to ${PROG().n} · due ${PROG().dl}. Save as you go. Everything here is reviewed by people on the MLT team.` : `${PROG().n} · submitted Oct 28 · ` + ({ submitted: 'Read-only while it is under review.', accepted: 'Accepted. Read-only.', waitlisted: 'Waitlisted. Read-only, except for the items MLT requested.', denied: 'Not admitted this cycle. Read-only.' }[S.pstage] || 'Read-only.'));
  const ro = S.pstage !== 'applying';
  const step = (i, inner, o = {}) => W(`Step ${i + 1} · ${APP_STEPS[i][0]}`, inner, Object.assign({ c: i < 3 || ro ? '' : 'key' }, o));
  return HDR('My Application', sub, ro ? C(PSTAGES[S.pstage], 'd') : B('Change program', { sm: 1, go: 'programs' }) + B('Save draft', { sm: 1 }) + B('Submit application', { p: 1, sm: 1, hl: 'submit-app' })) + `<div class="split">
    ${W('Steps', APP_STEPS.map((s, i) => ITEM(s[0], i === 5 ? `Due ${PROG().dl}${PROG().app !== `None` ? ` · fee ${PROG().app}` : ``}` : s[1], (ro || i < 3) ? C('✓') : i === 3 ? C('Next', 'd') : '', { chk: ro || i < 3 })).join(''))}
    <div class="stack">
      ${step(0, `<div style="margin-bottom:12px">${EMAILS({ status: 1, p: `avery.k@gmail.com`, s: `avery@state.edu`, note: `Entered when you created your account. Both are linked to one record.` })}</div><div class="g2" style="gap:10px">${F('School (searches the IPEDS list)', 'Wayne State University ▾')}${F('Major · grad year', 'Economics · 2028')}${F('GPA (optional)', '3.6')}${F('Track interest', 'Finance ▾')}</div><div style="margin-top:10px">${F('Work + leadership experience', 'Campus tutor (2 yrs) · Treasurer, Black Student Union · Summer retail associate', 'area')}</div>`)}
      <div class="g2">
        ${step(1, `${ITEM('avery_resume.pdf', 'Uploaded Oct 20 · becomes your first Fellow resume if accepted', B('Replace', { sm: 1 }))}`)}
        ${step(2, `${ITEM('transcript_fall2026.pdf', 'Uploaded Oct 20', B('Replace', { sm: 1 }))}`)}
      </div>
      ${step(3, ro ? ITEM('elevator_pitch.mp4', '1:12 · recorded Oct 26', B('Play', { sm: 1 })) : `<div class="row"><div class="img sp" style="height:120px">Camera preview</div><div class="stack" style="gap:6px;width:170px">${B('● Record (60 to 90 sec)', { sm: 1, p: 1 })}${B('Upload a video', { sm: 1 })}<div style="font-size:10.5px;color:var(--ink2)">Up to 3 takes. Tip: who you are, what you want, why MLT.</div></div></div>`, { hl: 'pitch' })}
      ${step(4, ESSAYS.map((e, i) => `<div class="fld" style="margin-bottom:10px">${i + 1}. ${e[0]} <span style="font-weight:400">(${e[1]} words max)</span>${I(ro ? 'Submitted answer…' : i === 0 ? 'Draft saved · 212 / 300 words' : 'Write your answer…', 'area')}</div>`).join('') + `<div style="font-size:10.5px;color:var(--ink2)">If accepted, these answers become the starting point for your first module, Career Clarity.</div>`)}
      ${EEO(ro)}
      ${W(`Application fee · ${PROG().n}`, PROG().app === `None` ? `<div style="font-size:12.5px">No application fee for this program.</div>` : `<div class="row"><div class="sp"><b style="font-size:14px">${PROG().app}</b><div style="font-size:11px;color:var(--ink2)">Paid when you submit.</div></div>${ro ? C(`Paid Oct 28`) : B(`Pay ${PROG().app} and submit`, { sm: 1, p: 1 })}</div>`, { c: PROG().app === `None` ? `dash` : `` })}
    </div></div>`;
};

P.onboard = r => {
  if (S.pstage !== 'accepted') return HDR('Enrollment', 'Unlocks if you are accepted', '') + `<div class="noaccess"><h3 style="font-family:var(--display)">Locked</h3>Once you're accepted, you'll sign your contract and code of conduct, handle the program fee, and complete an onboarding survey here.</div>`;
  const task = (t, sub, right, o) => ITEM(t, sub, right, Object.assign({ chk: false }, o));
  return HDR('Enrollment', 'Finish these 4 steps by Nov 20 to become a Fellow', C('2 of 4 done', 'g')) + `<div class="split">
    <div class="stack">
      ${W('Enrollment checklist', task('Program contract', 'Signed Nov 2 ✓', C('Done'), { chk: true }) + task('Code of conduct', 'Acknowledged Nov 2 ✓', C('Done'), { chk: true }) + task('Program fee', 'Pay in full or in installments', D('NOV 20', 1)) + task('Onboarding survey', '10 questions · about 5 minutes', B('Start', { sm: 1, modal: 'onboardSurvey' })), { c: 'key' })}
      ${W('What carries into your Fellow profile', ITEM('Basics, education, experience', 'Your Fellow profile', C('→')) + ITEM('avery_resume.pdf', 'Your first resume for job applications', C('→')) + ITEM('Short answers + essays', 'Starting draft for Module 1: Career Clarity', C('→')) + ITEM('Elevator pitch video', 'Shared with your coach', C('→')), { hl: 'carryover' })}
    </div>
    <div class="stack">
      ${W('Sign documents', `${ITEM('Program contract', 'MLT Career Prep 2026–28 · PDF', B('View signed copy', { sm: 1 }))}${ITEM('Code of conduct', 'Acknowledged · includes renege policy', B('View', { sm: 1 }))}`)}
      ${W('Program fee', PROG().fee === 'None' ? `<div style="font-size:12.5px"><b>No program fee for ${PROG().n}.</b> This step is skipped.</div>` : `<div class="row" style="margin-bottom:10px"><b class="sp" style="font-size:13px">${PROG().n} program fee: ${PROG().sub.length ? PROG().sub[0][1] : PROG().fee}</b>${PROG().sub.length ? C(PROG().sub[0][0] + ` subtype`, `d`) : ``}</div><div style="font-size:11px;color:var(--ink2);margin-bottom:10px">${PROG().note}.${PROG().sub.length ? ` You were placed in ${PROG().sub[0][0]} (${PROG().sub[0][1]}). ${PROG().sub[1][0]} is ${PROG().sub[1][1]}.` : ``}</div>
        <div class="fld">How would you like to pay?${RADIO(['Pay in full now', '3 monthly installments', '6 monthly installments'], 1)}</div>
        <div class="row" style="margin-top:10px">${I('Card or bank account ▾').replace('class="inp ', 'class="inp sp ')}${B('Set up payments', { p: 1, sm: 1, hl: 'pay' })}</div>
        <div style="font-size:10.5px;color:var(--ink2);margin-top:8px">${S.prog === 1 ? `Sliding scale: ${B('Request a reduced fee', { sm: 1 })}` : `Questions about cost? ${B('Contact MLT', { sm: 1 })}`}</div>`, { c: 'key' })}
    </div></div>`;
};

M.onboardSurvey = () => MH('Onboarding survey') + `<div class="stack" style="gap:12px">${F('1. What are your top 3 career goals for this year?', 'Type your answer…', 'area')}${F('2. Best days and times for coach calls', 'Weekday evenings ▾')}${F('3. How did you hear about MLT?', 'Choose one ▾')}${F('4. Anything your coach should know?', 'Optional…', 'area')}<div class="row"><span class="sp"></span>${B('Save for later', { sm: 1, close: 1 })}${B('Submit & become a Fellow', { p: 1, close: 1, hl: 'finish-onboard' })}</div></div>`;

// Assistant prompts for prospects. It coaches but won't write the application for them.
AI_SCOPE.prospect = [`Your account, application drafts, and status`, `Public MLT program info and FAQs`];
AI_CONVOS.prospect = [
  { q: `What makes a strong elevator pitch?`, ctx: `Application · step 4`, a: `<p>Keep it to about 75 seconds and cover three things:</p><ol style="margin:6px 0 6px 18px;padding:0;font-size:12px"><li>Who you are (school, major, one detail that is unique to you)</li><li>What you are working toward</li><li>Why MLT, and why now</li></ol><p style="font-size:11px;color:var(--ink2)">Practice once without notes, then record.</p>`, acts: ACT(`Go to step 4`, { go: 'apply' }) + ACT(`Practice with prompts`) },
  { q: `Can you check my first essay for clarity?`, ctx: `Application · essay 1 draft`, a: `<p>Your draft is clear and specific. Two suggestions:</p>${ITEM('Opening is general', 'Start with the moment you got interested in finance.', C('Tip'))}${ITEM('212 / 300 words', 'Room to add one concrete example.', C('Tip'))}<p style="font-size:11px;color:var(--ink2)">I can give feedback, but I won't write your answers. Applications are reviewed for your own voice.</p>`, acts: ACT(`Open essay`, { go: 'apply' }) },
  { q: `When will I hear back?`, ctx: `Application status`, a: `<p>Applications close <b>Dec 1</b>. Decisions go out by <b>Jan 15</b>, by email and on your dashboard.</p>`, acts: ACT(`View status`, { go: 'dashboard' }) }
];
</script>
<script>/* pages7.js */
// Admissions: Admin + PM manage the cycle and make decisions; coaches review and score assigned applications.
// The assistant gives an initial AI score; only people make decisions.
const RUBRIC = [[`Academic readiness`, 20], [`Career clarity`, 25], [`Leadership + experience`, 20], [`Communication (pitch + essays)`, 20], [`Fit with MLT`, 15]];
// The AI score adds the resume score (1 to 100) as one input at 10%; the other weights scale down to make room.
const AI_RUBRIC = [[`Academic readiness`, 18], [`Career clarity`, 22], [`Leadership + experience`, 18], [`Communication (pitch + essays)`, 18], [`Fit with MLT`, 14], [`Resume · AI resume score`, 10]];
const MIN_RESUME = 60;
const APPLICANTS = [
  [`Avery K.`, `State University · Econ · 2028`, `Finance`, 82, `4.3 (2)`, `Ready for decision`],
  [`Noah B.`, `Wayne State · CS · 2028`, `Tech`, 77, `3.9 (1)`, `Needs 1 more review`],
  [`Imani R.`, `Spelman · Psych · 2028`, `Corporate Mgmt`, 88, `—`, `Awaiting review`],
  [`Diego L.`, `UT Austin · Finance · 2028`, `Finance`, 64, `3.1 (2)`, `Ready for decision`],
  [`Grace O.`, `Howard · Poli Sci · 2028`, `Consulting`, 71, `—`, `Awaiting review`]
];

P.admissions = r => {
  const coach = r === 'coach';
  const tab = coach ? 'pipeline' : S.admTab;
  const tabs = coach ? '' : `<div class="row" style="margin-bottom:16px">${[['pipeline', 'Pipeline + reviews'], ['settings', 'Application settings']].map(([k, l]) => `<button class="chip ${tab === k ? 'd' : ''}" data-admtab="${k}" style="cursor:pointer">${l}</button>`).join('')}</div>`;
  const head = HDR(coach ? 'Application Reviews' : 'Admissions', coach ? '12 applications assigned to you · Finance track · score each one on the rubric' : 'Career Prep · Class of 2028 cycle · applications close Dec 1 · decisions by Jan 15', coach ? '' : B('Cycle ▾', { sm: 1 }) + B('Assign reviewers', { sm: 1, modal: 'assignReviewers' }) + B('Decision letters', { sm: 1, p: 1, go: 'decisioncomms' }));
  if (tab === 'settings') return head + tabs + ADM_SETTINGS();
  const list = coach ? APPLICANTS.filter(a => a[2] === 'Finance') : APPLICANTS;
  return head + tabs + `<div class="stack">
    ${coach ? '' : `<div class="g4">${KPI('4,180', 'Accounts created')}${KPI('2,960', 'Applications submitted')}${KPI('2,960', 'AI pre-scored')}${KPI('1,240', 'Human-reviewed (2+ scores)')}</div>`}
    ${W(coach ? 'My review queue' : 'Data table: applications', SEARCH('Search applicants') + T(['Applicant', 'School · major · year', 'Track', coach ? 'AI score' : 'AI score', 'Human score (n)', 'Status', ''], list.map((a, i) => ({ hl: i === 0 ? 'app-row' : '', c: [a[0], a[1], a[2], coach && i > 0 ? C('Hidden until you score', 'g') : `<b>${a[3]}</b>`, a[4], C(a[5], a[5].startsWith('Ready') ? 'd' : ''), B(i === 0 ? 'Open' : 'Review', { sm: 1, p: i === 0 })] }))) + `<div style="font-size:10.5px;color:var(--ink2);margin-top:10px;font-family:var(--mono)">1–25 of ${coach ? 12 : '2,960'} · ‹ 1 2 3 … ›</div>`)}
    <div class="g2">
      <div class="stack">
        ${W('Application · Avery K.', ITEM('avery_resume.pdf', 'Resume', B('Open', { sm: 1 })) + ITEM('transcript_fall2026.pdf', 'Transcript', B('Open', { sm: 1 })) + ITEM('elevator_pitch.mp4', 'Elevator pitch · 1:12', B('Play', { sm: 1 })) + ITEM('3 short answers', '212 · 288 · 174 words', B('Read', { sm: 1 })) + `<div style="font-size:10.5px;color:var(--ink2);margin-top:6px">EEO answers are never shown here or used in AI scoring.</div>`)}
        ${W('AI initial score · suggestion only', `<div class="row"><b style="font-family:var(--display);font-size:30px">82</b><span style="font-size:11px;color:var(--ink2)">/ 100 · top 30% of this cycle</span></div>${AI_RUBRIC.map(([n, w], i) => `<div class="row" style="font-size:11px;margin:5px 0"><span class="sp">${n} <span style="color:var(--ink2)">(${w}%)</span></span><div class="bar" style="width:90px;height:7px"><i style="width:${[78, 90, 74, 86, 80, 71][i]}%"></i></div></div>`).join('')}<div style="font-size:10.5px;color:var(--ink2);margin-top:4px">Resume score 71 (avery_resume.pdf) · staff only; applicants do not see it</div>
          <div style="font-size:11.5px;margin-top:8px"><b>Why:</b> clear finance goal tied to a specific experience; strong pitch; limited internship experience so far.</div>
          <div style="font-size:11.5px;margin-top:4px"><b>Check:</b> transcript GPA was hard to read. Please verify.</div>
          <div style="font-size:10.5px;color:var(--ink2);margin-top:10px;border-top:1px dashed var(--soft);padding-top:8px">The AI ranks and flags. It never accepts or declines anyone. ${coach ? 'You see this after you submit your own score, so it does not sway you.' : ''}</div>`, { c: 'dash', hl: 'ai-score' })}
      </div>
      <div class="stack">
        ${W(`Your score · ${ROLES[r].who}`, RUBRIC.map(([n]) => `<div class="row" style="font-size:12px;margin:6px 0"><span class="sp">${n}</span>${[1, 2, 3, 4, 5].map(v => `<span class="slot ${v === 4 ? 'pick' : ''}" style="width:26px;padding:3px">${v}</span>`).join('')}</div>`).join('') + F('Comments for the committee', 'What stood out, any concerns…', 'area') + `<div class="row" style="margin-top:10px"><span class="sp"></span>${B('Submit score', { p: 1, sm: 1, hl: 'submit-score' })}</div>`, { c: 'key' })}
        ${W('Human reviews', ITEM('Marcus T. · Coach', 'Score 4.2 · "Clear goals, coachable"', '', { av: 'MT' }) + ITEM('Priya R. · Program Manager', 'Score 4.4 · "Strong pitch"', '', { av: 'PR' }) + `<div style="font-size:10.5px;color:var(--ink2);margin-top:6px">A decision needs at least 2 human scores.</div>`)}
        ${coach ? '' : W('Decision (people only)', `<div class="row">${B('Accept', { p: 1, sm: 1, modal: 'decision', hl: 'accept-app' })}${B('Waitlist', { sm: 1, modal: 'waitlist' })}${B('Decline', { sm: 1 })}</div><div style="font-size:10.5px;color:var(--ink2);margin-top:8px">Decisions are held and released to applicants together on Jan 15.</div>`, { c: 'key' })}
      </div>
    </div></div>`;
};

const ADM_SETTINGS = () => `<div class="g2">
  <div class="stack">
    ${W('Cycle', `<div class="g2" style="gap:10px">${F('Opens', 'Sep 15, 2026')}${F('Closes', 'Dec 1, 2026')}${F('Decisions released', 'Jan 15, 2027')}${F('Enrollment deadline', '14 days after acceptance')}</div>`)}
    ${W('Application form', ITEM('Basics: school, major, grad year, experience', 'Account step', B('Edit', { sm: 1 })) + ITEM('Resume upload', 'Required · PDF/DOCX', B('Edit', { sm: 1 })) + ITEM('Transcript upload', 'Required', B('Edit', { sm: 1 })) + ITEM('Elevator pitch video', 'Required · 60 to 90 sec · 3 takes', B('Edit', { sm: 1 })) + ESSAYS.map((e, i) => ITEM(`Essay ${i + 1}`, `${e[1]} words · ${e[0]}`, B('Edit', { sm: 1 }))).join('') + `<div style="margin-top:8px">${B('+ Add question', { sm: 1 })}</div>`)}
  </div>
  <div class="stack">
    ${W('Scoring', `<div class="goal-l" style="margin-bottom:4px">Human rubric · weight</div>` + RUBRIC.map(([n, w]) => ITEM(n, 'Weight', C(w + '%'))).join('') + `<div class="goal-l" style="margin:10px 0 4px">AI score · weight</div><div style="font-size:11px">${AI_RUBRIC.map(([n, w]) => `${n} ${w}%`).join(' · ')}</div><div class="g2" style="gap:10px;margin-top:10px">${F('Human scores required', '2 per application')}${F('AI pre-scoring', 'On · suggestion only')}${F('Resume score weight in AI score', '10%')}</div><div style="font-size:10.5px;color:var(--ink2);margin-top:6px">No minimum resume score for MLT program applications. The ${MIN_RESUME} minimum applies only to company internship and job applications.</div>`, { hl: 'min-resume' })}
    ${W('Enrollment package (after acceptance)', ITEM('Program contract', 'contract_2026-28.pdf · e-signature', B('Replace', { sm: 1 })) + ITEM('Code of conduct', 'conduct_v4.pdf · acknowledge', B('Replace', { sm: 1 })) + ITEM('Program fee', 'Set per program below · pay in full or 3 or 6 installments', '') + ITEM('Onboarding survey', '10 questions', B('Edit', { sm: 1 })))}
    ${W('Programs, deadlines + fees (shown to prospects)', T(['Program', 'Apply by', 'App fee', 'Program fee', ''], PROGRAMS.map(p => [p.n + (p.sub.length ? `<br><span style="font-size:10.5px;color:var(--ink2)">${p.sub.map(s => s[0] + ' ' + s[1]).join(' · ')}</span>` : ''), p.dl, p.app, p.fee, B('Edit', { sm: 1 })])))}
  </div></div>`;

M.decision = () => MH('Accept Avery K.') + `<div class="stack" style="gap:12px"><div style="font-size:12px">Human scores: 4.2 and 4.4 · AI suggestion 82</div>${F('Track', 'Finance ▾')}${F('MBA Prep subtype (MBA Prep only)', 'Traditional ($1,000) ▾ / Accelerated ($3,000)')}${F('Coach to assign on enrollment', 'Marcus T. ▾')}${F('Program fee', 'Standard ▾ / Assistance approved / No fee')}${F('Note to applicant (optional)', 'Congratulations…', 'area')}<div class="row" style="font-size:11px;color:var(--ink2)">On release, Avery gets the acceptance plus the enrollment steps: contract, code of conduct, fee, onboarding survey.</div><div class="row"><span class="sp"></span>${B('Cancel', { sm: 1, close: 1 })}${B('Confirm accept', { p: 1, close: 1, hl: 'confirm-accept' })}</div></div>`;
</script>
<script>/* pages8.js */
// Programs list for prospects + the shared Inbox for staff.
// goals: [label, text]. Label 'or' marks an alternate version of the goal before it.

<script>/* pages11.js */
// Prospect stages: Pre-application → Applying → (Under review) → Accepted / Waitlisted / Denied.

const NEXT_CYCLE = `Sep 15, 2027`;
const WAIT_DOCS = [[`Updated transcript with fall 2026 grades`, `Requested Jan 15`, `JAN 31`], [`Short answer: Why now? (150 words)`, `Requested Jan 15`, `JAN 31`]];

  `<div class="row" style="margin-top:10px"><button class="btn sm" data-go="assistant" data-setaq="3">Ask the MLT Assistant</button>${B('Upload something else', { sm: 1 })}</div>`, { c: 'key', hl: 'waitlist-upload' });

const _dash3 = P.dashboard;
P.dashboard = r => {
  if (r !== 'prospect' || !['pre', 'waitlisted', 'denied'].includes(S.pstage)) return _dash3(r);
  const head = HDR(`Welcome, Avery`, S.pstage === 'pre' ? `Prospect · no application started yet` : `Prospect · ${PROG().n}`, B('Notifications (1)', { sm: 1 }));
  if (S.pstage === 'pre') return head + `<div class="stack">

  </div>`;
};

];

};

const internPct = g => g.secured ? 100 : g.apps.length ? Math.round(Math.max(...g.apps.map(a => INTERN_STAGES.indexOf(a[1]))) / (INTERN_STAGES.length - 1) * 90) : 0;
const ftPct = g => g.secured ? (g.secured.convertible === 'Yes' ? 70 : 35) + Math.min(20, g.ft.interviews * 5) : Math.min(30, g.ft.apps * 3 + g.ft.interviews * 8);
const PROX = (pct, label) => `<div class="row" style="gap:8px;margin-top:4px;flex-wrap:nowrap"><div class="bar" style="flex:1;height:9px"><i style="width:${pct}%"></i></div><b style="font-size:11px;white-space:nowrap">${pct}% · ${label}</b></div>`;

  return `<div class="goals" style="margin-top:14px;display:block" data-hl="goal-progress"><div class="goal-l" style="margin-bottom:8px">Progress toward program goals · Career Prep</div>

      <div><div class="goal-row"><span class="goal" aria-hidden="true"></span><div class="sp"><div class="goal-l">Goal 2</div><b>Secure a full-time job</b>${PROX(fp, g.secured ? 'Convertible internship' : 'Early')}</div></div><div style="font-size:11px;margin-top:8px;line-height:1.45">${ftDetail}</div></div>
