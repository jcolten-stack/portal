const ME = {
  admin:   { n: `Dana K.`, say: `DAY-nuh`, title: `Platform Administrator · MLT`, yrs: 6, kind: `staff` },
  pm:      { n: `Priya R.`, say: `PREE-yuh`, title: `Program Manager · Career Prep`, yrs: 4, kind: `staff` },
  coach:   { n: `Marcus T.`, say: `MAR-kus`, title: `Senior Coach · Finance track`, yrs: 5, kind: `staff` },
  fellow:  { n: `Jordan A.`, say: `JOR-dun`, title: `Career Prep fellow · Class of 2028`, kind: `fellow` },
  company: { n: `Kim L.`, say: `KIM`, title: `University Recruiting Lead · Acme Corp`, yrs: 7, org: `Acme`, kind: `rep` },
  mba:     { n: `Lena W.`, say: `LAY-nuh`, title: `MBA Admissions Officer · Ross School of Business`, yrs: 3, org: `Ross`, kind: `rep` }
};
const LINK_TYPES = [`GitHub`, `Instagram`, `Personal blog / website`, `Company website`];
const meFor = r => r === 'company' && S.crep === 'mba' ? ME.mba : ME[r];

const ABOUT_CARD = (p, opts = {}) => {
  const years = p.kind === 'staff' ? `${p.yrs} years at MLT` : p.kind === 'rep' && S.yrsShow ? `${p.yrs} years at ${p.org}` : '';
  const links = [`↗ LinkedIn`].concat(LINK_TYPES.slice(0, S.links).map(l => `↗ ${l}`));
  return `<div class="stack">
    ${W('About me', `<div class="row" style="align-items:flex-start"><div class="img" style="width:72px;height:72px;border-radius:50%;flex:none">photo</div><div class="sp"><div class="row" style="gap:8px"><b style="font-family:var(--display);font-size:19px">${p.n}</b><span style="font-size:12px;color:var(--ink2)">[pronouns]</span></div>
      <div class="row" style="gap:6px;margin-top:3px;font-size:11.5px"><span style="color:var(--ink2)">Say it:</span><b>${p.say}</b>${B('▶ Listen', { sm: 1 })}</div>
      <div style="font-size:12px;color:var(--ink2);margin-top:4px">${p.title}${years ? ` · ${years}` : ''}</div>
      <div class="row" style="gap:6px;margin-top:8px">${links.map(l => C(l)).join('')}</div></div>${opts.msg ? B('Message', { sm: 1, p: 1, go: 'messages' }) : ''}</div>`, { c: 'key' })}
    ${W('Short bio', L('', 'm', 's'))}
    ${p.kind === 'fellow' ? W('Program', `<div class="row">${C('Career Prep')}${C('Class of 2028')}${C('Finance track')}${C('Wayne State University')}</div>`) : ''}
    ${opts.coach ? W('Coaching profile · shown on Coach Info', `<div style="font-size:12px">${COACHES[0].cv}</div><div style="font-size:11.5px;color:var(--ink2);margin-top:6px">${COACHES[0].ed}</div><div class="row" style="margin-top:8px">${COACHES[0].likes.map(x => C(x)).join('')}</div>`) : ''}
  </div>`;
};

P.aboutme = r => {
  if (r === 'prospect') return HDR('About Me', '', '') + `<div class="noaccess"><h3 style="font-family:var(--display)">Not available yet</h3>Your About Me page opens once you're admitted to a program.</div>`;
  const p = meFor(r);
  const linkRows = LINK_TYPES.slice(0, S.links).map(l => `<div class="row" style="gap:8px;margin-top:6px">${I(l + ' ▾')}${I('https://…').replace('class="inp ', 'class="inp sp ')}${B('Remove', { sm: 1 })}</div>`).join('');
  const yearsField = p.kind === 'staff' ? F('Years at MLT', `${p.yrs}`) : p.kind === 'rep' ? `<div class="fld">Years at ${p.org}${I(`${p.yrs}`)}<div class="row" style="font-size:12px;gap:8px;font-weight:400;cursor:pointer" data-yrs="1"><span class="chk ${S.yrsShow ? 'x' : ''}"></span>Show on my About Me</div></div>` : '';
  const extras = r === 'coach' ? W('Coaching profile · fellows see this on Coach Info', `<div class="stack" style="gap:10px">${F('Track', 'Finance (set by your Program Manager)')}${F('CV summary', COACHES[0].cv, 'area')}${F('Education', COACHES[0].ed)}${F('Coaching focus', 'Resume reviews, networking, interview prep ▾')}${F('Outside interests', COACHES[0].likes.join(', '))}</div>`)
    : p.kind === 'fellow' ? W('Program details', `<div style="font-size:11.5px;color:var(--ink2)">Pulled from your program record. Current fellows and alumni can both edit their About Me.</div>${F('Interests', 'Investing, chess, mentoring')}`) : '';
  const sub = { staff: 'Your profile across the portal. Fellows, coaches, and partners see it when they click your name.', fellow: 'Visible to coaches, other fellows, and partners. Editable by current fellows and alumni.', rep: 'Anyone on the portal sees this as a pop-up when they click your name.' }[p.kind];
  return HDR('About Me', sub, B('Save', { p: 1, sm: 1 })) + `<div class="g2" style="align-items:start">
    <div class="stack">
      ${W('Basics', `<div class="stack" style="gap:10px"><div class="row">${`<div class="img" style="width:56px;height:56px;border-radius:50%">photo</div>`}${B('Upload photo', { sm: 1 })}</div>${F('Name', p.n)}
        <div class="g2" style="gap:10px">${F('Pronouns (optional)', 'she/her · he/him · they/them · self-describe ▾')}<div class="fld">Name pronunciation (optional)${I(`e.g. ${p.say}`)}<div class="row" style="gap:6px">${B('● Record', { sm: 1 })}${B('▶ Play', { sm: 1 })}</div></div></div>
        ${F('Title / headline', p.title)}${yearsField}${F('Short bio', 'A few sentences about you…', 'area')}</div>`, { hl: 'about-basics' })}
      ${W('Links', `<div class="fld">LinkedIn (always shown)${I('linkedin.com/in/…')}</div>${linkRows}<div class="row" style="margin-top:10px"><button class="btn sm" data-addlink="1"${S.links >= LINK_TYPES.length ? ' disabled' : ''}>+ Add a new link</button><span style="font-size:10.5px;color:var(--ink2)">GitHub, Instagram, personal blog or website, company website</span></div>`, { hl: 'about-links' })}
      ${extras}
    </div>
    <div><div style="font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--ink2);margin-bottom:10px">Live preview · what others see</div>${ABOUT_CARD(p, { coach: r === 'coach' })}</div>
  </div>`;
};

// The rep pop-up uses the same standard card.
M.aboutme = () => MH('About Kim L.') + ABOUT_CARD(ME.company, { msg: S.role !== 'company' }) + `<div style="font-size:10.5px;color:var(--ink2);margin-top:12px">Opens anywhere a name is clicked.</div>`;

// Menus: About Me sits in Account for everyone but prospects. Coaches edit their Coach Info through About Me.
PAGES.aboutme = { title: 'About Me', url: '/about-me' };
const addAbout = groups => { const acct = groups[groups.length - 1][1]; if (!acct.includes('aboutme')) acct.unshift('aboutme'); };
['admin', 'coach', 'fellow'].forEach(k => addAbout(NAV_GROUPS[k]));
NAV_GROUPS.coach[1][1] = NAV_GROUPS.coach[1][1].filter(k => k !== 'coachinfo');
['admin', 'coach', 'fellow'].forEach(k => { NAV[k] = NAV_GROUPS[k].flatMap(g => g[1]); });
if (!WS_ACCT[1].includes('aboutme')) WS_ACCT[1].unshift('aboutme');
PERMS.aboutme = { admin: ['E', 'own'], pm: ['E', 'own'], coach: ['E', 'own + Coach Info'], fellow: ['E', 'own · current + alumni'], company: ['E', 'own'], prospect: ['N', 'after admission'] };
PAGES.coachinfo.alt = { fellow: 'Coach Info' };
DATA_PERMS.push(
  { name: 'Pronouns + name pronunciation', sub: 'optional, on About Me', p: 'aboutme', v: { admin: ['E', 'own'], pm: ['E', 'own'], coach: ['E', 'own'], fellow: ['E', 'own'], company: ['E', 'own'], prospect: ['N'] } },
  { name: 'Years at MLT / Years at company', sub: 'reps can hide theirs', p: 'aboutme', v: { admin: ['E', 'own · shown'], pm: ['E', 'own · shown'], coach: ['E', 'own · shown'], fellow: ['N'], company: ['E', 'own · can hide'], prospect: ['N'] } }
);
ANNO.aboutme = { what: 'One standard About Me for every role except Prospect: photo, name, optional pronouns and name pronunciation (written + recording), title, bio, LinkedIn (always shown), and more links via "Add a new link".', roles: { admin: 'Adds Years at MLT.', pm: 'Adds Years at MLT.', coach: 'Adds Years at MLT and the coaching profile that fellows see on Coach Info.', fellow: 'Adds program details. Current fellows and alumni can both edit.', company: 'Adds Years at the company, which the rep can hide. Opens as a pop-up when anyone clicks their name.', prospect: 'No access until admitted.' } };
</script>
<script>/* pages16.js */
// v0.2 · Three kinds of access, and one person moving through many programs.
// Staff (Admin, PM, Coach) · Program Fellow (new applicant through alum) · Organization Rep (external).
// A Program Application links to a Program Enrollment once the person is admitted and finishes enrollment tasks.
const ACCESS = [['Staff', ['admin', 'pm', 'coach']], ['Program Fellow', ['prospect', 'fellow']], ['Organization Rep', ['company']]];
ROLE_KEYS.splice(0, ROLE_KEYS.length, ...ACCESS.flatMap(a => a[1]));
ROLES.prospect.label = 'New applicant';
ROLES.fellow.label = 'Fellow / Alum';
ROLES.company.label = 'Org Rep';
Object.defineProperty(ROLES.fellow, 'sub', { get: () => S.fj === 'alum' ? 'Career Prep alum · Class of 2026' : 'Career Prep · Class of 2028' });
Object.defineProperty(ME.fellow, 'title', { get: () => S.fj === 'alum' ? 'Career Prep alum · Class of 2026' : 'Career Prep fellow · Class of 2028' });

// Top bar: roles grouped by access kind. The matrix gets the same grouping.
const ACCESS_SEG = () => ACCESS.map(([l, ks]) => `<div class="ctl"><label>${l}</label>${seg('role', ks.map(k => [k, ROLES[k].label]), S.role)}</div>`).join('');
const ACCESS_HEAD = () => `<tr><th></th>${ACCESS.map(([l, ks]) => `<th colspan="${ks.length}" style="text-align:center;border-bottom:1.5px solid var(--ink)">${l}</th>`).join('')}</tr>`;
const FELLOW_CTLS = () => `${DUAL_CTL()}<div class="ctl"><label>Journey</label>${seg('fj', [['current', 'Current fellow'], ['alum', 'Alum']], S.fj)}</div><div class="ctl"><label>New application</label>${seg('fas', Object.entries(PSTAGES).map(([k, v]) => [k, k === 'pre' ? 'Not applying' : v]), S.fas)}</div>`;

// Fellows reuse the applicant pages: swap in the fellow's application state, render, swap back.
// Fellows and alumni get 20% off application fees, so their prices are swapped in for the render too.
const STD_FEE = PROGRAMS.map(p => p.app);
const FELLOW_FEE = a => /^\$\d+$/.test(a) ? '$' + Math.round(+a.slice(1) * 0.8) : a;
const asApplicant = fn => { const keep = [S.prog, S.pstage], fees = PROGRAMS.map(p => p.app); S.prog = S.fprog; S.pstage = S.fas; PROGRAMS.forEach(p => { p.app = FELLOW_FEE(p.app); }); try { return fn('prospect'); } finally { [S.prog, S.pstage] = keep; PROGRAMS.forEach((p, i) => { p.app = fees[i]; }); } };
const FPROG = () => PROGRAMS[S.fprog];

// Jordan's records: each Program Application, and the Program Enrollment it led to.
const PROGRAM_RECORDS = () => [
  { prog: 'Ascend', cls: 'Class of 2024', app: 'Accepted · Mar 2023', enr: 'Alum · completed Jun 2024', st: 'done' },
  { prog: 'Career Prep', cls: S.fj === 'alum' ? 'Class of 2026' : 'Class of 2028', app: S.fj === 'alum' ? 'Accepted · Jan 2025' : 'Accepted · Jan 2027', enr: S.fj === 'alum' ? 'Alum · completed May 2026' : 'Current fellow · Junior', st: S.fj === 'alum' ? 'done' : 'live' }
].concat(S.fas === 'pre' ? [] : [{ prog: FPROG().n, cls: 'Next cycle', app: PSTAGES[S.fas] + (S.fas === 'applying' ? ' · draft' : ' · submitted Nov 1'), enr: S.fas === 'accepted' ? 'Enrollment in progress · 2 of 4 tasks' : S.fas === 'denied' ? 'None · reapply next cycle' : 'Created if admitted + enrollment tasks done', st: 'new' }]);

P.myprograms = r => {
  const recs = PROGRAM_RECORDS();
  return HDR('My Programs', 'Every program you have applied to, and the enrollment each one led to. One account across all of them.', B('Apply to a program →', { p: 1, sm: 1, go: 'programs', hl: 'apply-new' })) + `<div class="stack">
    ${W('Program applications → Program enrollments', T(['Program', 'Program Application', '', 'Program Enrollment'], recs.map(x => ({ c: [`<b>${x.prog}</b><div style="font-size:10.5px;color:var(--ink2)">${x.cls}</div>`, x.app, '→', x.st === 'live' ? C(x.enr, 'd') : x.enr] , hl: x.st === 'new' ? 'new-app-row' : '' }))), { c: 'key' })}
    ${S.fas === 'pre' ? '' : W('Your open application', ITEM(FPROG().n, PSTAGES[S.fas], B(S.fas === 'accepted' ? 'Finish enrollment' : 'Open application', { sm: 1, p: 1, go: S.fas === 'accepted' ? 'onboard' : 'apply' })))}
    <div class="g2">
      ${W('Follows you across programs', ITEM('About Me + Badges', 'One profile, shown everywhere', C('Person')) + ITEM('Contact info + linked emails', 'Prefilled on every new application', C('Person')) + ITEM('Work experience + academic history', 'Prefilled, you can edit', C('Person')) + ITEM('EEO answers', 'Collected once. Never asked again.', C('Person')))}
      ${W('Stays with each program', ITEM('Coach + call notes', 'Each enrollment has its own coach', C('Enrollment')) + ITEM('Modules + assignments', '', C('Enrollment')) + ITEM('Infractions + statuses', 'MLT-only; reset for a new program', C('Enrollment')) + ITEM('Essays + elevator pitch', 'New for each application', C('Application')), { c: 'dash' })}
    </div></div>`;
};

const _programs16 = P.programs;
P.programs = r => r !== 'fellow' ? _programs16(r) : asApplicant(_programs16)
  .replace('Choose a Program', 'Apply to a Program')
  .replace('<div class="stack">', `<div class="stack">${W('Applying as an MLT fellow', `<div style="font-size:12px">Any program is open to you right now, and application fees are 20% off for fellows and alumni. Your contact info, work experience, and academic history carry into the new application. You're enrolled in <b>Career Prep</b>${S.fj === 'alum' ? ' (alum)' : ''}.</div>`, { c: 'dash' })}`);

const PREFILL_NOTE = W('Prefilled from your MLT record', `<div style="font-size:12px">Contact info, linked emails, work experience, and academic history came from your Career Prep record. Check them, then complete the new parts: resume update, essays, and pitch video. EEO answers are already on file, so they are not asked again.</div>`, { c: 'dash', hl: 'prefill' });
const _apply16 = P.apply;
P.apply = r => {
  if (r !== 'fellow') return _apply16(r);
  const ro = S.fas !== 'applying';
  return asApplicant(() => {
    const eeo = EEO(ro);
    return _apply16('prospect').replace(eeo, W('EEO · on file', `<div style="font-size:12px">Collected once when you applied to Ascend. Not asked again. Edit it in Settings if needed.</div>`, { c: 'dash' }))
      .replace('<div class="split">', `<div style="margin-bottom:18px">${PREFILL_NOTE}</div><div class="split">`)
      .replace('avery.k@gmail.com', 'jordan.a@gmail.com').replace('avery@state.edu', 'jordan@wayne.edu')
      .replace('Entered when you created your account.', 'From your MLT record.')
      .replace('Paid when you submit.', `Fellow rate: 20% off the standard ${STD_FEE[S.fprog]} fee. Paid when you submit.`)
      .replace('avery_resume.pdf', 'jordan_resume_v4.pdf').replace('becomes your first Fellow resume if accepted', 'latest resume from your Fellow profile')
      .replace('Campus tutor (2 yrs) · Treasurer, Black Student Union · Summer retail associate', 'Summer analyst, Acme Corp (2027) · Treasurer, Black Student Union · Campus tutor');
  });
};

const _onboard16 = P.onboard;
P.onboard = r => r !== 'fellow' ? _onboard16(r) : asApplicant(_onboard16).replace('to become a Fellow', `to enroll in ${FPROG().n}`).replace('What carries into your Fellow profile', `What carries into your ${FPROG().n} enrollment`).replace('Submit &amp; become a Fellow', 'Submit');

// Alumni get a lighter home: no coach calls or modules, but jobs, badges, chapters, and new programs.
const _dash16 = P.dashboard;
P.dashboard = r => r !== 'fellow' || S.fj !== 'alum' ? _dash16(r) : HDR('Welcome back, Jordan', 'Career Prep alum · Class of 2026', B('Apply to a program', { sm: 1, p: 1, go: 'programs' })) + `<div class="stack">
  <div class="g2">${W('Your programs', PROGRAM_RECORDS().map(x => ITEM(x.prog + ' · ' + x.cls, x.enr, C(x.st === 'new' ? 'Application' : 'Enrollment'))).join('') + `<div style="margin-top:8px">${B('My Programs →', { sm: 1, go: 'myprograms' })}</div>`)}
  ${W('Badges', `<div class="row">${BADGE('leader', 'MLT Rising Leader')}${BADGE('captain', 'Recruiting Captain')}</div><div style="margin-top:10px">${B('My Badges', { sm: 1, go: 'badges' })}</div>`)}</div>
  <div class="g2">${W('Jobs for alumni', ITEM('Associate · Acme Corp', 'Posted by a fellow alum (Boss badge)', B('View', { sm: 1, go: 'jobs' })) + ITEM('Senior Analyst · Globex', 'Apply by Dec 5', B('View', { sm: 1, go: 'jobs' })))}
  ${W('Events + chapters', ITEM('Detroit Chapter mixer', 'Nov 18', B('Register', { sm: 1, go: 'events' })) + ITEM('Join a chapter', 'Earn the Chapter Member badge', B('See chapters', { sm: 1, go: 'badges' })))}</div></div>`;

// Fellow menu: Programs section, which grows as an application moves along. Alumni drop coach + module pages.
const FELLOW_BASE = NAV_GROUPS.fellow;
const fellowGroups = () => {
  const alumHide = ['status', 'coachinfo', 'schedule', 'modules'];
  const prog = ['myprograms', 'programs'].concat(S.fas === 'pre' ? [] : ['apply']).concat(S.fas === 'accepted' ? ['onboard'] : []);
  const base = FELLOW_BASE.map(([l, ks]) => [l, S.fj === 'alum' ? ks.filter(k => !alumHide.includes(k)) : ks]).filter(g => g[1].length && !(S.fj === 'alum' && g[0] === 'Program'));
  base.splice(base.length - 2, 0, ['Programs', prog]);
  return base;
};
Object.defineProperty(NAV_GROUPS, 'fellow', { get: fellowGroups });
Object.defineProperty(NAV, 'fellow', { get: () => fellowGroups().flatMap(g => g[1]) });

PAGES.myprograms = { title: 'My Programs', url: '/my-programs' };
PAGES.programs.alt = Object.assign(PAGES.programs.alt || {}, { fellow: 'Apply to a Program' });
PERMS.myprograms = { admin: ['V', 'on fellow profiles'], pm: ['V', 'on fellow profiles'], coach: ['V', 'own fellows'], fellow: ['V', 'own history'], company: ['N'], prospect: ['N'] };
PERMS.programs.fellow = ['V', 'browse + apply'];
PERMS.apply.fellow = ['E', 'own · prefilled'];
PERMS.onboard.fellow = ['E', 'after acceptance'];
DATA_PERMS.push(
  { name: 'Program Application → Enrollment', sub: 'one record per program', p: 'myprograms', v: { admin: ['E'], pm: ['E'], coach: ['V', 'own fellows'], fellow: ['V', 'own'], company: ['N'], prospect: ['V', 'own application'] } },
  { name: 'Prefilled profile data', sub: 'contact, work, academics', p: 'apply', v: { admin: ['V'], pm: ['V'], coach: ['N'], fellow: ['E', 'own'], company: ['N'], prospect: ['E', 'own'] } }
);
ANNO.myprograms = { what: 'One account across every program. Each Program Application links to a Program Enrollment once the person is admitted and finishes the enrollment tasks. About Me, Badges, contact info, and EEO answers follow the person. Coach, modules, infractions, and statuses stay with each enrollment.', roles: { fellow: 'Use the Journey and New application switches at the top to see a current fellow or an alum applying to another program.', pm: 'Shown on the fellow profile.', admin: 'Shown on the fellow profile.' } };
ANNO.programs.roles.fellow = 'Fellows and alumni can apply to any program for now. Eligibility rules (for example, "Career Prep alumni can apply to MBA Prep") can be added later.';
ANNO.apply.roles.fellow = 'Same application as a new applicant. Contact info, work experience, and academic history are prefilled. EEO is already on file. Essays and the pitch video are new.';
ANNO.onboard.roles.fellow = 'Same enrollment tasks, scoped to the new program. Completing them creates the new Program Enrollment.';
FLOWS.push({ id: 'reapply', title: 'A Career Prep alum applies to MBA Prep', roles: ['fellow'], steps: [
  { r: 'fellow', p: 'dashboard', set: { fj: 'alum', fas: 'pre' }, t: 'Jordan finished Career Prep and logs in as an alum. Same account, lighter menu.' },
  { r: 'fellow', p: 'myprograms', set: { fj: 'alum', fas: 'pre' }, hl: 'apply-new', t: 'My Programs lists each Program Application and the Program Enrollment it led to.' },
  { r: 'fellow', p: 'apply', set: { fj: 'alum', fas: 'applying', fprog: 2 }, hl: 'prefill', t: 'Jordan picks MBA Prep. Contact info, work experience, and academic history are prefilled; EEO is not asked again.' },
  { r: 'fellow', p: 'onboard', set: { fj: 'alum', fas: 'accepted', fprog: 2 }, t: 'Once accepted, the enrollment tasks create a new MBA Prep enrollment. About Me and Badges come along.' }
]});
</script>
<script>/* pages17.js */
// v0.2 · Concurrent enrollment (rare, allowed) and dual access for alumni who are also Org Reps.
const CONCURRENT = () => S.fj === 'current' && ['accepted'].includes(S.fas);
const CONCURRENT_NOTE = () => W('Concurrent enrollment', `<div class="row" style="align-items:flex-start"><span class="due">!</span><div class="sp" style="font-size:12px">You're still enrolled in <b>Career Prep</b>. Finishing these tasks enrolls you in <b>${FPROG().n}</b> at the same time. This is rare, so your Program Manager gets a notice. Each enrollment keeps its own coach, modules, and infractions.</div></div>`, { c: 'key', hl: 'concurrent' });

const _onboard17 = P.onboard;
P.onboard = r => r === 'fellow' && CONCURRENT() ? _onboard17(r).replace('<div class="stack">', `<div class="stack">${CONCURRENT_NOTE()}`) : _onboard17(r);
const _myprog17 = P.myprograms;
P.myprograms = r => S.fj === 'current' && S.fas === 'accepted' ? _myprog17(r).replace('<div class="stack">', `<div class="stack">${CONCURRENT_NOTE()}`) : _myprog17(r);

// PMs hear about concurrent enrollments in the Inbox, under Program Setup.
PM_INBOX.push(['Setup', 'Concurrent enrollment: Jordan A.', 'Accepted to MBA Prep while still in Career Prep · check coach load', 'TODAY', 1, 'Review', { go: 'fellows' }, 'setup']);

// One account, two kinds of access. A toggle in the menu swaps between them; each keeps its own menu and permissions.
const DUAL_BTN = r => S.dual ? `<button class="btn sm" data-modal="dualSwitch" style="margin-top:8px;width:100%">${r === 'fellow' ? 'Switch to Org Rep ▾' : 'Switch to Fellow / Alum ▾'}</button>` : '';
M.dualSwitch = () => MH('Switch access') + `<div class="stack" style="gap:8px"><div style="font-size:12px;color:var(--ink2)">This alum also works at a partner company. One account, two kinds of access. Each keeps its own menu, permissions, and Inbox. Fellow data you can see as an alum never carries into the Org Rep view, and the reverse.</div>
  ${ITEM('Fellow / Alum', 'Career Prep alum · My Programs, Badges, jobs, chapters', S.role === 'fellow' ? C('Current', 'd') : B('Switch', { sm: 1, p: 1 }).replace('<button', '<button data-role="fellow"'))}
  ${ITEM('Org Rep · Acme Corp', 'Rep · granted by an MLT Admin or the Acme company admin', S.role === 'company' ? C('Current', 'd') : B('Switch', { sm: 1, p: 1 }).replace('<button', '<button data-role="company"'))}</div>`;

DATA_PERMS.push(
  { name: 'Concurrent enrollments', sub: 'allowed, flagged to PM', p: 'myprograms', v: { admin: ['V'], pm: ['E', 'notified'], coach: ['V', 'own fellows'], fellow: ['V', 'own'], company: ['N'], prospect: ['N'] } },
  { name: 'Alum + Org Rep on one account', sub: 'granted by MLT Admin or company admin', p: 'myprograms', v: { admin: ['E', 'grants both'], pm: ['V'], coach: ['N'], fellow: ['V', 'own'], company: ['E', 'company admin grants'], prospect: ['N'] } },

const FIELD = (l, v) => `<div><div style="font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:2px">${l}</div><div style="font-size:11.5px">${v || '<span style="color:var(--ink3)">—</span>'}</div></div>`;

const BRAG_CARD = (e, j, mine, coach, tpl) => W(tpl.n, `<div class="row" style="align-items:flex-start"><div class="sp"><b style="font-size:13px">${e.t}</b><div style="font-size:10.5px;color:var(--ink2);margin-top:2px">Received ${e.recv} · deadline ${e.due} · delivered ${e.del}</div></div>${C(e.used ? `In ${e.used} resume bullet${e.used > 1 ? 's' : ''}` : 'Not on a resume yet', e.used ? 'd' : 'g')}${mine ? B('Edit', { sm: 1, modal: 'bragEntry' }) + B('Use in a resume', { sm: 1, go: 'builder' }) : ''}</div>

P.bragbook = r => {

  const tabs = [['brags', 'Accomplishments'], ['rel', 'Relationships']].map(([k, l]) => `<button class="chip${tab === k ? ' d' : ''}" data-bbtab="${k}" style="cursor:pointer">${l}</button>`).join('');

  return HDR(who, sub, mine ? B('Download as spreadsheet', { sm: 1 }) : B('Back to profile', { sm: 1, go: 'fellows' })) + `<div class="split">

    <div class="stack"><div class="row" style="gap:8px"><b style="font-family:var(--display);font-size:17px">${x.t} · ${x.org}</b>${C(tpl.n)}<span class="sp"></span>${tabs}</div>${body}</div></div>`;
};

M.bragEntry = () => { const x = EXPERIENCES[S.bbx] || EXPERIENCES[0], tpl = BRAG_TPL[x.type];
  return MH(`New ${tpl.n} entry · ${x.t}, ${x.org}`) + `<div class="stack" style="gap:12px">
  <div class="g3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${F('Started', 'Date or "Not assigned"')}${F('Deadline', 'Date')}${F('Finished', 'Date')}</div>
  ${F(tpl.task, 'What was it?', 'area')}${F(tpl.impact, 'What changed because of your work? Use numbers if you can.', 'area')}

  ${F('Colleagues involved or who evaluated your work', 'Names + roles')}
  <div class="g2" style="gap:10px">${F('Positive feedback (optional)', 'Date · person · what they said')}${F('Developmental feedback (optional)', 'What to work on')}</div>

// ---------- My Experience: the same work, community, and education fields for new applicants and fellows ----------
const xpFor = r => r === 'prospect' ? AVERY_XP : EXPERIENCES;

  ${W('Education', `<div class="g2" style="gap:10px">${F('School', 'Search the federal college list (IPEDS) ▾')}${F('Degree', 'BA, BS, MBA… ▾')}${F('Major / field', '')}${F('GPA (optional)', '')}${F('Graduation date', 'Month, year')}${F('Honors (optional)', 'e.g. Dean\'s List')}</div>${F('Relevant coursework (optional)', '')}`, { c: 'dash' })}

// ---------- AI score: 1 to 100. MLT + track standards, accuracy against the record, ATS readability ----------
const scoreFor = r => r === 'prospect' ? { n: S.rs, parts: [
    [`Format`, `MLT standards for applicants`, S.rs < 60 ? 58 : 80, [`One page ✓`, `Education first ✓`, `No dates on the tutoring role`]],
    [`Matches your profile`, `My Experience`, S.rs < 60 ? 41 : 62, [`4 of 5 bullets match your profile`, `"Top tutor in the department" is not on your profile. Add it to My Experience or edit the bullet.`]],
    [`ATS readability`, `How applicant tracking systems read it`, S.rs < 60 ? 63 : 88, [`Single column, standard headings ✓`]]] }
  : { n: 86, parts: [
    [`Format`, `MLT standards + Finance track rules`, 90, [`One page ✓`, `Education first, GPA listed ✓`, `Dates use two different styles`]],
    [`Matches your record`, `My Experience + Brag Book`, 78, [`5 of 6 bullets match your Brag Book or work history`, `"Led a team of 5 analysts" is not on record. Add it to your Brag Book or edit the bullet.`]],
    [`ATS readability`, `How applicant tracking systems read it`, 92, [`Single column, standard headings ✓`, `Contact info sits in a text box that some systems skip`]]] };
const SCOREBAR = n => `<div style="height:6px;background:#e8e3d8;border-radius:3px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${n}%;background:var(--ink)"></div></div>`;
const GRADE_PANEL = (o = {}) => { const g = scoreFor(S.role); return W(`AI score${o.ver ? ' · ' + o.ver : ''}`, `<div class="row" style="align-items:center;gap:12px"><b style="font-family:var(--display);font-size:32px;line-height:1">${g.n}</b><div class="sp" style="font-size:11px;color:var(--ink2)">out of 100 · scored automatically when saved · ${S.role === 'prospect' ? (g.n >= MIN_RESUME ? 'meets the ' + MIN_RESUME + ' minimum to apply' : '<b>below the ' + MIN_RESUME + ' minimum to apply</b>') : 'a guide, not a gate'}</div></div>` +
  g.parts.map(([n, s, v, notes]) => `<div style="margin-top:10px"><div class="row"><b style="font-size:12px">${n}</b><span style="font-size:10.5px;color:var(--ink2)">${s}</span><span class="sp"></span><b style="font-family:var(--mono);font-size:11px">${v}</b></div>${SCOREBAR(v)}${o.compact ? '' : notes.map(t => `<div style="font-size:11px;margin-top:3px">${t.includes('✓') ? '' : '• '}${t}</div>`).join('')}</div>`).join(''), { c: 'key', hl: 'ai-grade' }); };
const JOB_MATCH = () => W('Optional · score against a job', S.jm ? `<div class="row"><div class="sp"><b>Acme Corp · Summer Analyst Intern</b><div style="font-size:10.5px;color:var(--ink2)">Pasted link · scored just now · saved to this resume</div></div><b style="font-family:var(--display);font-size:24px">74</b></div>

    <div class="row" style="margin-top:8px">${B('Score another job', { sm: 1 }).replace('<button', '<button data-jm="0"')}${B('Build a tailored version', { sm: 1, p: 1, go: 'builder' })}</div>`
  : `${F('Paste a job link or the job description', 'https://… or paste the text', 'area')}<div class="row" style="margin-top:8px"><span class="sp"></span>${B('Score against this job', { sm: 1, p: 1, hl: 'job-score' }).replace('<button', '<button data-jm="1"')}</div><div style="font-size:10.5px;color:var(--ink2);margin-top:4px">Fellows and coaches can both run this, on any resume.</div>`, { hl: 'job-match' });

  const start = starts.map(([k, l, s]) => `<div class="wf ${S.bstart === k ? 'key' : 'dash'}" data-bstart="${k}" style="cursor:pointer"><b style="font-size:13px">${l}</b><div style="font-size:11px;color:var(--ink2);margin-top:2px">${s}</div></div>`).join('');
  const src = S.bstart === 'copy' ? F('Start from', appl ? 'avery_resume.pdf (uploaded Oct 20) ▾' : 'General · Finance v6 · AI score 86 ▾') : S.bstart === 'template' ? F('Template', appl ? 'First resume · Undergraduate · one page ▾' : 'Finance · Undergraduate · one page ▾ (from the Resource Library)') : `<div style="font-size:11.5px">Pulled in: <b>4 experiences</b> from My Experience${appl ? '' : ' and <b>5 Brag Book entries</b>'}. Uncheck anything you want to leave out.</div>`;
  const exp = ([t, org, when, type, bl]) => `<div style="margin-top:10px"><div class="row"><span class="chk x"></span><b style="font-size:12.5px">${t} · ${org}</b><span style="font-size:10.5px;color:var(--ink2)">${BRAG_TPL[type].n} · ${when}</span><span class="sp"></span>${B('↑', { sm: 1 })}${B('↓', { sm: 1 })}</div>${bl.map(([b, s, ok]) => `<div class="row" style="gap:6px;margin:5px 0 0 22px;font-size:11.5px"><span class="sp">• ${b}</span>${C(ok ? s : '⚠ ' + s, ok ? '' : 'd')}</div>`).join('')}<div style="margin:6px 0 0 22px">${B(appl ? '+ Bullet from My Experience' : '+ Bullet from Brag Book', { sm: 1, hl: t === d.exps[0][0] ? 'from-brag' : '' })}${B('Suggest wording (AI)', { sm: 1 })}</div></div>`;

  return HDR('Resume Builder', appl ? 'Build your resume from your profile, check its AI score, export a PDF, and attach it to your application.' : 'Build a resume in the portal, then export to PDF. Bullets link back to your Brag Book, so the AI can check that each one reflects what you actually did.', (appl ? B('Use in my application', { sm: 1, go: 'apply', hl: 'use-in-app' }) : B('Save as new resume', { sm: 1 })) + B('Export PDF', { p: 1, sm: 1, hl: 'export-pdf' })) + `<div class="stack">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">${start}</div>${W('Source', src)}
    <div class="g2" style="align-items:start">
      <div class="stack">${W('Sections · drag to reorder', `<div class="row"><span class="chk x"></span><b style="font-size:12.5px">Header</b><span style="font-size:11px;color:var(--ink2)">Name, email, phone, LinkedIn · from your profile</span></div>
        <div style="margin-top:10px"><div class="row"><span class="chk x"></span><b style="font-size:12.5px">Education · ${d.edu[0]}</b></div><div style="font-size:11.5px;margin:4px 0 0 22px">• ${d.edu[1]}</div></div>
        ${d.exps.map(exp).join('')}
        <div style="margin-top:10px"><div class="row"><span class="chk x"></span><b style="font-size:12.5px">Skills</b><span style="font-size:11px;color:var(--ink2)">${appl ? 'Excel, Spanish, customer service' : 'Excel, PowerPoint, financial modeling'}</span></div></div>`, { hl: 'builder-sections' })}</div>
      <div class="stack">${W('Live preview · PDF', preview)}${GRADE_PANEL({ ver: 'this draft' })}${appl ? '' : JOB_MATCH()}</div>
    </div></div>`;
};

    <div class="app">
      ${bare ? '' : `<nav class="side"><div class="logo">LOGO</div>${NAV_MENU(r, p)}
        <div class="me"><span class="av">${ROLES[r].init}</span><div class="sp"><b>${ROLES[r].who}</b><div style="color:var(--ink2);font-size:10px">${ROLES[r].label}</div></div><button class="btn sm" data-nav="login">Log out</button></div>${r === 'fellow' || (r === 'company' && S.dual) ? DUAL_BTN(r) : ''}${r === 'pm' ? '<button class="btn sm" data-modal="roleSwitch" style="margin-top:8px;width:100%">Switch role ▾</button>' : ''}</nav>`}
      <div class="content" id="content">${body}</div>
    </div>
    ${bare ? '' : `<div class="tabbar">${tabs}</div>`}
    ${S.modal ? `<div class="scrim" data-scrim><div class="modal">${S.modal === 'more' ? moreMenu() : M[S.modal]()}</div></div>` : ''}
  </div>`;
  $('#main').innerHTML = `<div class="proto"><div class="stage">${flowBar()}${frame}</div>${annotation()}</div>`;
  highlight();
}

function moreMenu() {
  return MH('Menu') + NAV_MENU(S.role, S.page) + `<button class="nav" style="width:100%" data-nav="login">Log out</button>`;
}

function annotation() {
  const p = S.page, a = ANNO[p], r = S.role;
  const roles = Object.entries(a.roles).map(([k, v]) => `<li class="${k === r || (k === 'all' && !a.roles[r]) ? 'me-r' : ''}"><b>${k === 'all' ? 'Everyone' : ROLES[k].label}:</b> ${v}</li>`).join('');
  const who = ROLE_KEYS.filter(k => p === 'login' || canSee(p, k)).map(k => C(RA[k] + ' · ' + PERMS[p][k][0], PERMS[p][k][0] === 'E' ? 'd' : '')).join(' ');
  const flows = FLOWS.filter(f => f.steps.some(s => s.p === p));
  return `<aside class="anno">
    <div class="sticky"><h4>${pageTitle(p, r)}</h4><p>${a.what}</p><ul>${roles}</ul></div>
    <div class="wf" data-l="Who can access"><div class="row" style="gap:6px">${who}</div><div style="font-size:11px;color:var(--ink2);margin-top:8px">E = view + edit · V = view only</div></div>
    ${flows.length ? `<div class="wf" data-l="Flows on this page">${flows.map(f => `<div class="item"><div class="t"><b>${f.title}</b></div><button class="btn sm" data-fstart="${f.id}">Play ▸</button></div>`).join('')}</div>` : ''}
    <div class="legend">Click nav items, buttons, slots, and cards to move between screens. Switch roles at the top: each role gets its own navigation. Bold labels mark interactive elements.</div>
  </aside>`;
}

function highlight() {
  if (!S.flow) return;
  const st = FLOWS.find(x => x.id === S.flow).steps[S.step];
  const el = st.hl && document.querySelector(`#frame [data-hl="${st.hl}"]`);
  if (!el) return;
  el.classList.add('pulse');
  el.setAttribute('data-step', 'Step ' + (S.step + 1));
  if (el.tagName !== 'TR') el.style.position = el.style.position || 'relative';
  setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60);
}

// ---------- sitemap ----------
const SUBS = {
  users: ['Invite user (modal)', 'Edit user / change role'],
  approvals: ['Job posting review', 'Coach reassignment', 'Sign-up approval'],
  program: ['Program setup form', 'Coach compliance', 'Fellow compliance', 'Milestones'],
  fellows: ['Fellow search', 'Profile header + AI summary', 'Coach call records (notes + AI summary per call)', 'Assign task (modal)'],
  schedule: ['Book call (modal)', 'Leave feedback (modal)', 'Coach availability'],
  modules: ['Lesson player', 'Assignment submit', 'Quiz'],
  jobs: ['Job detail & apply (modal)', 'Saved / My applications'],
  accounts: ['Account detail + relationship log', 'Post a job (modal)', 'Applicants'],
  messages: ['Conversation', 'Search · People or Keywords', 'Keyword results · jump to match'],
  assistant: ['Chat + suggested prompts', 'Answer actions (draft, nudge, open)', 'Data scope panel', 'Conversation mode · Professional / Casual'],
  coachinfo: ['Coach directory (fellow, PM)', 'Coach edits via About Me'],
  events: ['Cvent registration links', 'Pre + post surveys (fellow and rep versions)', 'Survey builder (PM, Admin)', 'Completion tracking + nudges'],
  inbox: ['Filter by type', 'Today vs. later', 'One action per item'],
  programs: ['Program cards', 'Fee comparison'],
  decisioncomms: ['Accept / Waitlist / Decline templates', 'Preview + scheduled release'],
  cycles: ['Cycles by program', 'Next cycle setup', 'Coach availability'],
  reports: ['YoY KPIs', 'Charts + table', 'Build a view', 'Board pack export'],
  matching: ['Partner request', 'Suggested fellows', 'Share shortlist'],
  companies: ['Company directory', 'Company page (main rep edits)', 'Featured MLT hires'],
  bschools: ['MBA program list', 'School profile (MBA officer edits)'],
  ugschools: ['IPEDS search', 'Fellows at my school'],
  roster: ['Filters', 'Roster table', 'How scores are calculated'],
  badges: ['My Badges (fellow)', 'Badge sign-up (modal)', 'Entrepreneur confirmation', 'Alumni chapters', 'Coach badges · My Badges (coach)', 'Coach badge types (PM + Admin)'],
  apply: ['Basics (at sign-up)', 'Uploads: resume + transcript', 'Elevator pitch video', 'Essays', 'Submit'],
  experience: ['Work experience', 'Community involvement', 'Education'],
  focus: ['Fellow at a glance', 'Assistant in call mode', 'Exit confirm', 'Zoom summary · upload or paste'],
  bragbook: ['Accomplishments by experience', 'Relationships tab', 'Coach comments'],
  builder: ['Start: copy, history, or template', 'AI score 1 to 100', 'Job match', 'Export PDF'],
  library: ['Resume templates (best match first)', 'Brag Book entry guides · global', 'Interview Prep · Mindfulness audio', 'Standards + guides', 'Mock interview questions · staff only', 'Edit resource · PM approval'],
  resumes: ['Resume viewer + versions', 'Upload + tailor', 'Pin for next call'],
  myprograms: ['Applications → Enrollments', 'Follows the person vs. stays with the enrollment'],
  onboard: ['Contract + code of conduct', 'Program fee (full or installments)', 'Onboarding survey'],
  admissions: ['AI initial score', 'Human scoring rubric', 'Decision (modal)', 'Application settings'],
  aboutme: ['Edit + live preview (all but prospect)', 'Rep pop-up on name click', 'Coaching profile (coach)', 'Locked until admitted (prospect)'],
  nudge: ['Audience tabs (PM)', 'Bulk nudge + template'],
  exits: ['Process withdrawal (modal)', 'Issue infraction (modal)', 'Dismiss fellow (modal)', 'Dismissal rules'],
  status: ['Infraction history', 'Upcoming timeline'],
  coachstats: ['Feedback time series', 'Per-question averages'],
  settings: ['Profile', 'Notifications', 'Integrations (Admin)']
};
const rd = p => `<div class="rd">${ROLE_KEYS.filter(k => p === 'login' || canSee(p, k)).map(k => `<i style="${PERMS[p][k][0] === 'E' ? 'background:var(--ink);color:var(--sheet)' : ''}">${RA[k]}</i>`).join('')}</div>`;
const firstRole = p => canSee(p, S.role) ? S.role : ROLE_KEYS.find(k => canSee(p, k));

function renderMap() {
  const pages = Object.keys(PAGES).filter(p => p !== 'login' && p !== 'dashboard');
  $('#main').innerHTML = `<div class="sheet"><h2>Sitemap & page flow</h2><p class="sub">Every role logs in to a role-specific dashboard, then reaches only the pages in its navigation. Dashed boxes are sub-screens and modals. Role tags: filled = edit, outlined = view. Click any page to open it in the prototype.</p>
    <div class="smap" id="smap"><svg id="smsvg"></svg>
      <div class="tier"><button class="node root" id="n-login" data-jump="${S.role}|login"><b>Login / Sign up</b><span style="font-size:10px">invite · SSO · request access</span></button></div>
      <div class="tier"><button class="node root" id="n-dashboard" data-jump="${S.role}|dashboard"><b>Dashboard</b><span style="font-size:10px">role-specific · "Due soon" first</span></button></div>
      <div class="tier pages subs">${pages.map(p => `<div class="subcol"><button class="node" id="n-${p}" data-jump="${firstRole(p)}|${p}"><b>${PAGES[p].title}</b>${rd(p)}</button>${(SUBS[p] || []).map((s, i) => `<div class="node sub" id="s-${p}-${i}">${s}</div>`).join('')}</div>`).join('')}</div>
    </div></div>`;
  requestAnimationFrame(drawLines);
}

function drawLines() {
  const box = $('#smap'), svg = $('#smsvg');
  if (!box || !svg) return;
  const b = box.getBoundingClientRect();
  const pt = (id, side) => { const r = document.getElementById(id).getBoundingClientRect(); return [r.left + r.width / 2 - b.left, (side === 't' ? r.top : r.bottom) - b.top]; };
  const path = (a, c, dash) => { const my = (a[1] + c[1]) / 2; return `<path d="M${a[0]},${a[1]} C${a[0]},${my} ${c[0]},${my} ${c[0]},${c[1]}" fill="none" stroke="${dash ? '#8a8a86' : '#1b1b1b'}" stroke-width="1.4" ${dash ? 'stroke-dasharray="4 3"' : ''}/>`; };
  let out = path(pt('n-login', 'b'), pt('n-dashboard', 't'));
  Object.keys(PAGES).filter(p => p !== 'login' && p !== 'dashboard').forEach(p => {
    out += path(pt('n-dashboard', 'b'), pt('n-' + p, 't'));
    let prev = 'n-' + p;
    (SUBS[p] || []).forEach((_, i) => { out += path(pt(prev, 'b'), pt(`s-${p}-${i}`, 't'), 1); prev = `s-${p}-${i}`; });
  });
  svg.innerHTML = out;
}

// ---------- permissions ----------
function renderPerms() {
  const cell = (p, k, src = PERMS[p]) => { const [v, n] = src[k]; return `<td><button class="cell" data-jump="${k}|${p}"><b class="${v}">${v === 'N' ? '—' : v}</b>${n ? `<small>${n}</small>` : ''}</button></td>`; };
  $('#main').innerHTML = `<div class="sheet"><h2>Permissions matrix</h2><p class="sub"><b>E</b> = view + edit · <b>V</b> = view only · <b>—</b> = no access (page hidden from navigation). Click any cell to see that page as that role.</p>
    <div class="tblw"><table class="mx">${ACCESS_HEAD()}<tr><th>Page</th>${ROLE_KEYS.map(k => `<th>${ROLES[k].label}</th>`).join('')}</tr>
    ${Object.keys(PAGES).map(p => `<tr><td>${PAGES[p].title}<span>${PAGES[p].url}</span></td>${ROLE_KEYS.map(k => cell(p, k)).join('')}</tr>`).join('')}
    <tr><th colspan="${ROLE_KEYS.length + 1}" style="text-align:left;padding-top:28px">Data-level rules (cut across pages)</th></tr>
    ${DATA_PERMS.map(d => `<tr><td>${d.name}<span>${d.sub}</span></td>${ROLE_KEYS.map(k => cell(d.p, k, d.v)).join('')}</tr>`).join('')}</table></div>
    <div class="row" style="margin-top:22px;gap:14px;align-items:stretch">${[1, 2, 3].map(n => W('Company ' + TIERS[n].label, `<b style="font-size:13px">${TIERS[n].name}</b><div style="font-size:11.5px;color:var(--ink2);margin-top:4px">${TIERS[n].sub}</div>`, { s: 'flex:1;min-width:200px' })).join('')}</div></div>`;
}

// ---------- flows ----------
function renderFlows() {
  $('#main').innerHTML = `<div class="sheet"><h2>Key flows</h2><p class="sub">Each flow walks across roles. Press Play to step through it in the prototype; the active element is outlined on every step.</p>
    <div class="flows">${FLOWS.map((f, i) => `<div class="flowcard"><div class="row"><h3 class="sp">${i + 1}. ${f.title}</h3><button class="btn p sm" data-fstart="${f.id}">Play ▸</button></div>
      <div class="row">${f.roles.map(k => C(ROLES[k].label)).join('')}</div>
      <ol>${f.steps.map(s => `<li><span class="sp">${s.t}</span><em>${RA[s.r]} · ${PAGES[s.p].title}</em></li>`).join('')}</ol></div>`).join('')}</div></div>`;
}

// ---------- routing ----------
function render() {
  // A PM page outside the current workstream (e.g. from a flow) switches to the workstream that owns it.
  if (S.role === 'pm' && S.page !== 'login' && !NAV.pm.includes(S.page) && wsFor(S.page)) S.ws = wsFor(S.page);
  renderTop();
  ({ proto: renderProto, map: renderMap, perms: renderPerms, flows: renderFlows })[S.view]();
}
function applyStep() {
  const st = FLOWS.find(x => x.id === S.flow).steps[S.step];
  Object.assign(S, { view: 'proto', role: st.r, page: st.p, modal: st.m || null }, st.set || {});
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-role],[data-tier],[data-cohort],[data-aud],[data-aq],[data-ci],[data-ev],[data-svtype],[data-svaud],[data-pstage],[data-admtab],[data-prog],[data-ibx],[data-ws],[data-dctab],[data-cyc],[data-plv],[data-crep],[data-co],[data-bs],[data-fsel],[data-call],[data-rf],[data-zup],[data-fq],[data-jres],[data-rs],[data-bbx],[data-bbtab],[data-bstart],[data-jm],[data-libf],[data-libx],[data-tone],[data-msq],[data-rfil],[data-dual],[data-fj],[data-fas],[data-addlink],[data-yrs],[data-dev],[data-nav],[data-go],[data-modal],[data-close],[data-scrim],[data-jump],[data-fstart],[data-fnext],[data-fprev],[data-fexit]');
  if (!t) return;
  const d = t.dataset;
  if (d.prog !== undefined && S.role === 'fellow') { if (['pre', 'denied'].includes(S.fas)) S.fas = 'applying'; S.fprog = +d.prog; }
  else if (d.prog !== undefined) { if (['pre', 'denied'].includes(S.pstage) && +d.prog !== S.prog || S.pstage === 'pre') S.pstage = 'applying'; S.prog = +d.prog; }
  if (d.setaq !== undefined) S.aq = +d.setaq;
  if (d.rsel !== undefined) S.rsel = +d.rsel;
  if (d.fsel) { S.fsel = d.fsel; S.call = 0; }
  if (d.scrim !== undefined && e.target !== t) return;
  if (d.view) { S.view = d.view; S.modal = null; }
  else if (d.tier) S.tier = +d.tier;
  else if (d.cohort) S.cohort = d.cohort;
  else if (d.aud) S.aud = d.aud;
  else if (d.aq) S.aq = +d.aq;
  else if (d.ci) S.ciSel = +d.ci;
  else if (d.ev) S.ev = +d.ev;
  else if (d.svtype) S.svType = d.svtype;
  else if (d.svaud) S.svAud = d.svaud;
  else if (d.pstage) S.pstage = d.pstage;
  else if (d.admtab) S.admTab = d.admtab;
  else if (d.ibx) S.ibx = d.ibx;
  else if (d.ws) { S.ws = d.ws; if (!NAV.pm.includes(S.page)) S.page = 'dashboard'; }
  else if (d.dctab) S.dctab = d.dctab;
  else if (d.cyc) S.cyc = d.cyc;
  else if (d.plv) S.plv = d.plv;
  else if (d.crep) { S.crep = d.crep; if (S.page !== 'login' && !NAV.company.includes(S.page)) S.page = 'dashboard'; }
  else if (d.co) S.coSel = +d.co;
  else if (d.bs) S.bsSel = +d.bs;
  else if (d.call !== undefined) S.call = S.call === +d.call ? -1 : +d.call;
  else if (d.zup) S.zup = d.zup;
  else if (d.fq) S.fq = +d.fq;
  else if (d.jres) S.jres = +d.jres;
  else if (d.rs) S.rs = +d.rs;
  else if (d.bbx !== undefined) S.bbx = +d.bbx;
  else if (d.bbtab) S.bbtab = d.bbtab;
  else if (d.bstart) S.bstart = d.bstart;
  else if (d.jm !== undefined) S.jm = +d.jm;
  else if (d.libf) S.libf = d.libf;
  else if (d.tone) S.tone = d.tone;
  else if (d.msq) S.msq = d.msq;
  else if (d.libx) { const a = S.libopen.split(',').filter(Boolean); S.libopen = d.libx === 'all' ? (a.length ? '' : RES_LIB.map(s => s.k).join(',')) : (a.includes(d.libx) ? a.filter(x => x !== d.libx) : a.concat(d.libx)).join(','); }
  else if (d.rfil) S.rfil = d.rfil;
  else if (d.dual) S.dual = +d.dual;
  else if (d.fj) { S.fj = d.fj; if (S.page !== 'login' && !NAV.fellow.includes(S.page)) S.page = 'dashboard'; }
  else if (d.fas) { S.fas = d.fas; if (['apply', 'onboard'].includes(S.page) && !NAV.fellow.includes(S.page)) S.page = 'myprograms'; }
  else if (d.addlink) S.links = Math.min(S.links + 1, LINK_TYPES.length);
  else if (d.yrs) S.yrsShow = S.yrsShow ? 0 : 1;
  else if (d.rf) { const [k, v] = d.rf.split(':'); if (k === 'clear') S.rf = { needs: 0, flagged: 0, exit: 0, cls: 'all', timing: 'all', ready: 'all', eng: 'all' }; else S.rf[k] = v === 'toggle' ? (S.rf[k] ? 0 : 1) : v; }
  else if (d.role) { S.role = d.role; S.modal = null; S.aq = 0; S.ciSel = 0; if (S.page !== 'login' && !canSee(S.page, S.role)) S.page = 'dashboard'; }
  else if (d.dev) S.mobile = d.dev === 'm';
  else if (d.nav || d.go) { S.page = d.nav || d.go; S.modal = null; }
  else if (d.modal) S.modal = d.modal;
  else if (d.close !== undefined || d.scrim !== undefined) S.modal = null;
  else if (d.jump) { const [r, p] = d.jump.split('|'); Object.assign(S, { role: r, page: p, view: 'proto', modal: null }); }
  else if (d.fstart) { S.flow = d.fstart; S.step = 0; return applyStep(); }
  else if (d.fnext !== undefined) { S.step++; return applyStep(); }
  else if (d.fprev !== undefined) { S.step--; return applyStep(); }
  else if (d.fexit !== undefined) { S.flow = null; S.modal = null; }
  render();
});
window.addEventListener('resize', () => S.view === 'map' && drawLines());
render();
</script>
